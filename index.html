<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src * data: blob:; media-src * data: blob:; style-src 'self' 'unsafe-inline' *; connect-src *; frame-src 'none'">
<title>清平乐•醉清欢</title>
<style>:root{
  --paper:#f7f2e7;
  --paper-2:#eee3d1;
  --card:#fffdf7;
  --ink:#313b36;
  --ink-2:#5c6660;
  --sub:#8d9088;
  --line:rgba(120,100,70,.18);
  --jade:#2f5d50;
  --jade-deep:#22453b;
  --cinnabar:#a8473c;
  --gold:#b08d57;
  --shadow:0 6px 18px rgba(74,58,38,.08);
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Kaiti SC","KaiTi",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--serif);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 50% -10%, #fffdf6 0%, rgba(255,253,246,0) 60%),
    linear-gradient(180deg,#f3ecdd,#efe7d6 55%,#efe5d2);
  min-height:100vh;
  overscroll-behavior-y:none;
}
img{-webkit-user-drag:none}
button{font-family:var(--serif);cursor:pointer}
input,textarea{font-family:var(--serif)}
.hidden{display:none!important}

/* 手机壳 */
#app,#authScreen,#splash{max-width:480px;margin:0 auto;position:relative}
.app-bg{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(circle at 12% 8%, rgba(176,141,87,.10), transparent 40%),
  radial-gradient(circle at 88% 92%, rgba(47,93,80,.10), transparent 45%);}

/* ============ 启动画面 ============ */
#splash{
  position:fixed;inset:0;z-index:1200;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(160deg,#28473d,#1c3129 60%,#2a3a30);
  color:#f3ead6;transition:opacity .6s ease, visibility .6s;
  background-size:cover;background-position:center;
}
#splash.fade{opacity:0;visibility:hidden}
.splash-seal{
  width:74px;height:74px;border:2px solid rgba(243,234,214,.55);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:26px;letter-spacing:2px;
  background:rgba(0,0,0,.12);backdrop-filter:blur(2px);
}
.splash-title{font-size:28px;letter-spacing:8px;text-indent:8px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.splash-sub{font-size:13px;letter-spacing:4px;opacity:.75}
.splash-line{width:60px;height:1px;background:rgba(243,234,214,.35);margin:4px 0}

/* ============ 登录 ============ */
#authScreen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 26px 90px;position:relative;z-index:20}
.auth-logo{width:84px;height:84px;margin:0 auto 18px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(150deg,#fffdf6,#ece1cd);display:flex;align-items:center;justify-content:center;
  font-size:30px;color:var(--jade);box-shadow:var(--shadow)}
.auth-title{text-align:center;font-size:26px;letter-spacing:6px;text-indent:6px}
.auth-sub{text-align:center;color:var(--sub);font-size:12.5px;letter-spacing:2px;margin:10px 0 34px}
.auth-panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.btn{border:none;border-radius:10px;padding:12px 16px;font-size:15px;width:100%;letter-spacing:2px;transition:.18s}
.btn-primary{background:linear-gradient(180deg,#35695b,#2a5347);color:#f6efdf;box-shadow:0 6px 14px rgba(47,93,80,.22)}
.btn-primary:active{transform:translateY(1px);opacity:.92}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-wechat{background:#07c160;color:#fff;box-shadow:0 6px 14px rgba(7,193,96,.22)}
.btn-gold{background:linear-gradient(180deg,#c2a175,#a8875c);color:#fffaf0}
.btn-danger{background:#fff;color:var(--cinnabar);border:1px solid rgba(168,71,60,.35)}
.btn-mini{width:auto;padding:6px 12px;font-size:12px;border-radius:8px;letter-spacing:0}
.auth-note{margin-top:16px;font-size:11.5px;color:var(--sub);line-height:1.9;text-align:center}

/* 微信授权弹窗 */
.wechat-card{background:#fff;border-radius:16px;overflow:hidden;width:100%;max-width:340px}
.wx-head{background:#f7f7f7;padding:14px;text-align:center;font-size:13px;color:#666;border-bottom:1px solid #eee}
.wx-body{padding:18px}
.wx-app{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.wx-app-icon{width:40px;height:40px;border-radius:8px;background:#07c160;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.wx-app-name{font-size:15px}
.wx-app-desc{font-size:12px;color:#999}
.wx-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #f0f0f0}
.wx-row .lbl{font-size:13px;color:#666;width:56px}
.wx-row .val{font-size:13px;color:#333;flex:1}

/* ============ 主界面 ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  padding:12px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:linear-gradient(180deg,rgba(250,246,237,.98),rgba(247,242,231,.92));
  border-bottom:1px solid var(--line);backdrop-filter:blur(10px);
}
.topbar .brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-seal{width:30px;height:30px;border:1px solid rgba(47,93,80,.45);border-radius:6px;color:var(--jade);
  display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(255,255,255,.6);flex:none}
.brand-title{font-size:17px;letter-spacing:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-title small{display:block;font-size:10px;letter-spacing:2px;color:var(--sub);margin-top:2px}
.topbar-actions{display:flex;gap:8px;flex:none}
.icon-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--jade)}
.icon-btn .dot{position:absolute;transform:translate(12px,-12px);width:8px;height:8px;border-radius:50%;background:var(--cinnabar)}

main{padding:14px 14px 84px}
.page{display:none}
.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-title{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--jade);margin-bottom:10px;letter-spacing:1px}
.card-title .bar{width:3px;height:14px;background:var(--jade);border-radius:2px}
.card-title .tag{margin-left:auto;font-size:10.5px;color:var(--sub);letter-spacing:0}
.hint{font-size:11.5px;color:var(--sub);line-height:1.7}
.hint-warn{color:var(--cinnabar)}

.ta{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.7;
  background:#fffefb;outline:none;resize:none;color:var(--ink)}
.ta:focus{border-color:rgba(47,93,80,.5);box-shadow:0 0 0 3px rgba(47,93,80,.08)}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;background:#fffefb;outline:none;color:var(--ink)}
.inp:focus{border-color:rgba(47,93,80,.5);box-shadow:0 0 0 3px rgba(47,93,80,.08)}
.row{display:flex;gap:8px;align-items:center}
.row .grow{flex:1;min-width:0}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}

/* 子标签 */
.subtabs{display:flex;gap:6px;padding:4px;background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow-x:auto}
.subtab{flex:1;min-width:66px;text-align:center;padding:9px 4px;font-size:13px;color:var(--ink-2);border-radius:9px;white-space:nowrap}
.subtab.active{background:linear-gradient(180deg,#35695b,#2a5347);color:#f6efdf;box-shadow:0 3px 8px rgba(47,93,80,.2)}

/* 接龙 / 投票 / 统计 列表 */
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;box-shadow:var(--shadow)}
.item-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.item-head b{font-size:14.5px;color:var(--ink);font-weight:600}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;letter-spacing:0;white-space:nowrap}
.badge-pin{background:rgba(168,71,60,.1);color:var(--cinnabar);border:1px solid rgba(168,71,60,.25)}
.badge-role{background:rgba(47,93,80,.1);color:var(--jade);border:1px solid rgba(47,93,80,.22)}
.badge-ok{background:rgba(47,93,80,.08);color:var(--jade)}
.badge-wait{background:rgba(176,141,87,.14);color:#8a6a35}
.badge-time{margin-left:auto;font-size:10.5px;color:var(--sub);letter-spacing:0}
.meta{font-size:11px;color:var(--sub);line-height:1.7}

.progress{height:5px;border-radius:4px;background:rgba(120,100,70,.14);overflow:hidden;margin:6px 0}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,#4a7d6c,#b08d57);width:0;transition:width .3s}

.participants{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.person{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:rgba(47,93,80,.06);
  border:1px solid rgba(47,93,80,.12);border-radius:999px;padding:3px 8px 3px 3px;color:var(--ink-2)}
.person img{width:18px;height:18px;border-radius:50%}

.options{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.opt{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:#fffefb}
.opt:active{background:#f6f0e3}
.opt .opt-name{flex:1;min-width:0}
.opt .opt-cnt{font-size:11.5px;color:var(--sub)}
.opt.voted{border-color:rgba(47,93,80,.45);background:rgba(47,93,80,.06)}
.opt .radio{width:14px;height:14px;border-radius:50%;border:1px solid rgba(47,93,80,.5);flex:none}
.opt.voted .radio{background:var(--jade);border-color:var(--jade)}

/* 朋友圈 */
.moment{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
.moment-top{display:flex;gap:10px;padding:13px 13px 8px;align-items:center}
.moment-top img{width:40px;height:40px;border-radius:9px;object-fit:cover}
.avatar{width:40px;height:40px;border-radius:9px;object-fit:cover}
.m-name{font-size:13.5px;color:var(--jade)}
.m-time{font-size:10.5px;color:var(--sub);margin-top:2px}
.m-del{margin-left:auto;font-size:13px;color:var(--sub);padding:2px 6px}
.m-text{padding:0 14px 10px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.m-imgs{display:grid;gap:4px;padding:0 0 0;grid-template-columns:repeat(3,1fr)}
.m-imgs.one{grid-template-columns:1fr}
.m-imgs.two{grid-template-columns:repeat(2,1fr)}
.m-imgs img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.m-imgs.one img{aspect-ratio:4/3}
.m-actions{display:flex;gap:18px;padding:10px 14px;border-top:1px solid rgba(120,100,70,.08)}
.m-act{font-size:12px;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center;background:none;border:none;padding:2px 0}
.m-act.liked{color:var(--cinnabar)}
.img-pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.img-pick .thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.img-pick .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-pick .thumb span{position:absolute;top:0;right:0;width:18px;height:18px;background:rgba(0,0,0,.55);color:#fff;
  font-size:12px;display:flex;align-items:center;justify-content:center;border-radius:0 0 0 6px}

/* 每日清平 */
.notice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;box-shadow:var(--shadow)}
.notice.pinned{border-color:rgba(168,71,60,.28)}
.n-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.n-title{font-size:13.5px;color:var(--jade)}
.n-body{font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.n-body img{width:100%;border-radius:10px;margin-top:8px;display:block}
.boards{display:flex;flex-direction:column;gap:8px}
.board-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:rgba(176,141,87,.07);border:1px solid rgba(176,141,87,.18)}
.board-rank{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;
  background:linear-gradient(180deg,#c9ab7c,#a8875c);color:#fff;flex:none}
.board-row.r2 .board-rank{background:linear-gradient(180deg,#c8c8c8,#a9a9a9)}
.board-row.r3 .board-rank{background:linear-gradient(180deg,#cba98c,#ab8264)}
.board-row img{width:26px;height:26px;border-radius:50%}
.board-name{font-size:13px;flex:1;min-width:0}
.board-val{font-size:11px;color:var(--sub)}
.summary{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(47,93,80,.05);border:1px dashed rgba(47,93,80,.25);
  font-size:12.5px;line-height:2;color:var(--ink-2)}

/* 诗词 */
.poem-wrap{position:relative;background:linear-gradient(160deg,#fffdf6,#f3ead6);border:1px solid var(--line);border-radius:16px;
  padding:22px 20px;box-shadow:var(--shadow);overflow:hidden}
.poem-wrap::after{content:"詩";position:absolute;right:-6px;bottom:-24px;font-size:96px;color:rgba(176,141,87,.10);pointer-events:none}
.poem-tag{display:inline-block;font-size:10.5px;letter-spacing:2px;color:var(--jade);border:1px solid rgba(47,93,80,.25);
  border-radius:999px;padding:3px 10px;margin-bottom:14px;background:rgba(255,255,255,.6)}
.poem-title{font-size:21px;letter-spacing:3px;text-align:center;color:var(--ink)}
.poem-author{text-align:center;font-size:11.5px;color:var(--sub);margin:6px 0 16px;letter-spacing:1px}
.poem-body{font-size:16px;line-height:2.2;text-align:center;letter-spacing:2px;white-space:pre-line;color:#3a453f}
.poem-appr{margin-top:18px;padding-top:14px;border-top:1px solid rgba(120,100,70,.15);font-size:12.5px;line-height:2;color:var(--ink-2)}
.poem-appr b{color:var(--jade);font-weight:600;letter-spacing:1px}
.poem-his{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(120,100,70,.1);font-size:12.5px}
.poem-his .d{color:var(--sub);font-size:11px;width:52px;flex:none}
.poem-his .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 好友 */
.friend-row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(120,100,70,.1)}
.friend-row:last-child{border-bottom:none}
.friend-row img{width:42px;height:42px;border-radius:10px;object-fit:cover}
.friend-row .f-main{flex:1;min-width:0}
.friend-row .f-name{font-size:14px;display:flex;align-items:center;gap:6px}
.friend-row .f-sub{font-size:11px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--sub);font-size:12px}
.section-label{font-size:11.5px;color:var(--sub);letter-spacing:2px;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}
.req{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;display:flex;align-items:center;gap:10px}
.req img{width:36px;height:36px;border-radius:9px}
.req .r-main{flex:1;min-width:0}
.req .r-name{font-size:13px}
.req .r-sub{font-size:11px;color:var(--sub);margin-top:2px}

/* 底部导航 */
.tabbar{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;height:64px;display:flex;z-index:50;
  background:linear-gradient(180deg,rgba(253,250,243,.96),rgba(247,241,230,.99));border-top:1px solid var(--line);
  box-shadow:0 -4px 18px rgba(74,58,38,.08);backdrop-filter:blur(12px);padding-bottom:env(safe-area-inset-bottom)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);font-size:10.5px;letter-spacing:1px;position:relative}
.tab-item .seal{width:24px;height:24px;border-radius:6px;border:1px solid rgba(120,100,70,.25);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--ink-2);background:rgba(255,255,255,.5);transition:.2s}
.tab-item.active{color:var(--jade);font-weight:600}
.tab-item.active .seal{background:linear-gradient(180deg,#35695b,#2a5347);color:#f6efdf;border-color:transparent;box-shadow:0 4px 10px rgba(47,93,80,.25)}
.tab-item .nav-dot{position:absolute;top:8px;right:calc(50% - 20px);width:7px;height:7px;border-radius:50%;background:var(--cinnabar)}

/* 侧边抽屉 */
#drawerMask{position:fixed;inset:0;background:rgba(30,36,32,.45);z-index:200;opacity:0;visibility:hidden;transition:.3s;backdrop-filter:blur(2px)}
#drawerMask.open{opacity:1;visibility:visible}
#drawer{visibility:hidden;position:fixed;top:0;left:max(0px, calc(50vw - 240px));bottom:0;width:83%;max-width:360px;z-index:210;background:linear-gradient(180deg,#fffdf7,#f6efe2);
  transform:translateX(-104%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow-y:auto;box-shadow:6px 0 24px rgba(40,30,10,.18)}
#drawer.open{transform:translateX(0);visibility:visible}
.drawer-head{padding:26px 18px 16px;background:linear-gradient(160deg,#2f5d50,#243f35);color:#f3ead6;position:relative}
.drawer-head .dh-title{font-size:12px;letter-spacing:4px;opacity:.8}
.drawer-head .dh-me{display:flex;align-items:center;gap:11px;margin-top:16px}
.drawer-head img{width:56px;height:56px;border-radius:12px;border:1px solid rgba(243,234,214,.4);object-fit:cover}
.drawer-head .dh-name{font-size:16px;letter-spacing:1px}
.drawer-head .dh-sig{font-size:11px;opacity:.75;margin-top:4px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-body{padding:16px 16px 30px}
.set-group{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px}
.set-group h4{font-size:12.5px;color:var(--jade);letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.set-line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(120,100,70,.08);font-size:13px}
.set-line:last-of-type{border-bottom:none}
.set-line .lbl{flex:none;width:76px;color:var(--ink-2);font-size:12.5px}
.set-line .val{flex:1;min-width:0;font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-line .act{flex:none;font-size:11.5px;color:var(--jade);border:1px solid rgba(47,93,80,.25);padding:4px 9px;border-radius:7px;background:#fff}
.set-line .act.red{color:var(--cinnabar);border-color:rgba(168,71,60,.3)}

/* 弹层 */
#modalMask{position:fixed;inset:0;background:rgba(30,36,32,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
#modalMask.show{display:flex}
.modal{width:100%;max-width:400px;background:var(--card);border-radius:16px;padding:18px;box-shadow:0 18px 40px rgba(30,25,15,.25);
  max-height:86vh;overflow-y:auto;animation:pop .22s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:16px;color:var(--jade);letter-spacing:2px;text-align:center;margin-bottom:14px}
.modal p{font-size:12.5px;color:var(--sub);line-height:1.9}

/* 操作面板 */
#sheetMask{position:fixed;inset:0;background:rgba(30,36,32,.45);z-index:280;display:none;align-items:flex-end;justify-content:center}
#sheetMask.show{display:flex}
.sheet{width:100%;max-width:480px;background:#f8f2e6;border-radius:18px 18px 0 0;padding:8px 12px 18px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 12px 12px;border-bottom:1px solid var(--line)}
.sheet-head img{width:40px;height:40px;border-radius:10px}
.sheet-head b{font-size:14px}
.sheet-head small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.sheet-item{padding:14px 12px;font-size:15px;color:var(--ink);border-bottom:1px solid rgba(120,100,70,.1);text-align:center}
.sheet-item:active{background:#f1e9da}
.sheet-item.danger{color:var(--cinnabar)}
.sheet-cancel{margin-top:8px;border-radius:10px;background:#fff;color:var(--sub);text-align:center;padding:13px;font-size:14px}

/* 聊天 */
#chatView{position:fixed;inset:0;max-width:480px;margin:0 auto;z-index:150;display:none;flex-direction:column;background:#f4ede0}
#chatView.show{display:flex}
.chat-head{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(250,246,237,.98),rgba(247,242,231,.94));backdrop-filter:blur(8px);z-index:5}
.chat-head .back{border:none;background:none;font-size:22px;color:var(--jade);padding:0 4px;line-height:1}
.chat-head .ch-main{flex:1;min-width:0;text-align:center}
.chat-head .ch-name{font-size:14.5px;letter-spacing:1px}
.chat-head .ch-sub{font-size:10px;color:var(--sub)}
.chat-head .more{border:none;background:none;font-size:16px;color:var(--jade);padding:0 4px}
.chat-body{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:10px;background-size:cover;background-position:center}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:82%}
.msg img{width:30px;height:30px;border-radius:8px;flex:none}
.msg .bubble{background:rgba(255,255,255,.94);padding:9px 12px;border-radius:4px 12px 12px 12px;font-size:14px;line-height:1.65;
  word-break:break-word;box-shadow:0 2px 8px rgba(74,58,38,.08);border:1px solid rgba(255,255,255,.6)}
.msg .btime{font-size:10px;color:var(--sub);margin-top:4px;text-align:left}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg.me .bubble{background:linear-gradient(180deg,#3d7466,#2f5d50);color:#f2ecdd;border-radius:12px 4px 12px 12px}
.msg.me .btime{text-align:right}
.msg.sys{max-width:100%;margin:0 auto;justify-content:center;text-align:center}
.msg.sys .bubble{background:rgba(255,255,255,.7);color:var(--sub);font-size:11px;border-radius:999px;padding:4px 12px;box-shadow:none}
.msg .who{font-size:10.5px;color:rgba(0,0,0,.45);margin-bottom:3px;margin-left:2px}
.chat-input{display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(253,250,243,.97);border-top:1px solid var(--line);align-items:center}
.chat-input .plus{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--jade);font-size:18px;flex:none}
.chat-input input{flex:1;min-width:0;border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-size:14px;background:#fffefb;outline:none}
.chat-input .send{width:56px;flex:none;border-radius:18px;border:none;background:linear-gradient(180deg,#35695b,#2a5347);color:#f6efdf;padding:10px 0;font-size:14px;letter-spacing:1px}

/* 个人主页 */
.profile-cover{height:150px;border-radius:14px 14px 0 0;background-size:cover;background-position:center;position:relative;overflow:hidden}
.profile-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.25))}
.profile-main{margin-top:-34px;padding:0 16px 18px;position:relative;z-index:2}
.profile-main img.p-avatar{width:72px;height:72px;border-radius:14px;border:2px solid #fffdf7;object-fit:cover;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.p-name{font-size:17px;margin-top:9px;display:flex;align-items:center;gap:8px}
.p-sig{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.7}
.p-stat{display:flex;gap:18px;margin-top:12px;font-size:11.5px;color:var(--sub)}
.p-stat b{color:var(--ink);font-size:13px;margin-right:3px}
.p-actions{display:flex;gap:8px;margin-top:14px}

.empty{text-align:center;color:var(--sub);font-size:12.5px;padding:28px 10px;line-height:2}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:rgba(42,54,48,.94);color:#f6efdf;
  font-size:13px;padding:10px 18px;border-radius:10px;z-index:500;opacity:0;transition:.25s;max-width:80%;width:max-content;text-align:center;line-height:1.6;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.role-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);display:inline-block}
.fab{position:fixed;right:calc(50% - 240px + 14px);bottom:80px;z-index:60;width:52px;height:52px;border-radius:50%;border:none;
  background:linear-gradient(180deg,#35695b,#2a5347);color:#f6efdf;font-size:24px;box-shadow:0 8px 20px rgba(47,93,80,.3);display:flex;align-items:center;justify-content:center}
@media(max-width:520px){.fab{right:14px}}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adm{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px;display:flex;gap:8px;align-items:center}
.adm img{width:32px;height:32px;border-radius:8px}
.adm .a-name{font-size:12.5px}
.adm .a-role{font-size:10px;color:var(--sub);margin-top:2px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-2)}
audio{width:100%;margin-top:6px}

.pm-badge{position:absolute;right:12px;top:12px;z-index:2;font-size:11.5px;letter-spacing:1px;color:#fdf6e6;background:rgba(47,93,80,.72);padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)}
</style>
</head>

<script>'use strict';
/* 本文件不含任何广告 SDK、联盟代码或第三方推广位；所有资源自持，
   不接入任何广告投放、统计监听，广告入口从底层就不存在。 */
/* =========================================================
   清平乐•醉清欢  ·  帅知社区（纯前端本地数据版）
   ========================================================= */

const KEY = 'qlz_state_v2';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = n => (n < 10 ? '0' + n : '' + n);
const ymd = (x) => { const d = x instanceof Date ? x : new Date(x == null ? Date.now() : x); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dayShift = n => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function fmtTime(ts) {
  const d = new Date(ts), now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (ymd(d) === ymd(now)) return '今日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (ymd(d) === ymd(dayShift(-1))) return '昨日 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtFull(ts) {
  const d = new Date(ts);
  return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function leftText(ts) {
  const ms = ts - Date.now();
  if (ms <= 0) return '已截止';
  const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000);
  return h > 0 ? `余 ${h} 小时 ${m} 分` : `余 ${m} 分`;
}

/* ---------- 头像 / 插画 ---------- */
function svgAvatar(text, a, b) {
  const t = (text || '客').slice(0, 2);
  const g = [['#2f5d50', '#8aa79b'], ['#a8473c', '#d8a68f'], ['#3d5a80', '#8fb0c9'],
  ['#7a5c3e', '#cbb08a'], ['#5c6b4a', '#adbf8f'], ['#6b4a63', '#c39bb0'],
  ['#2e4a4a', '#93b3ad'], ['#8a5a2b', '#d9b884']][(t.charCodeAt(0) || 0) % 8];
  const c1 = a || g[0], c2 = b || g[1];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="128" height="128" fill="url(#g)"/><text x="64" y="82" font-size="48" font-family="serif" fill="#fdf8ec" text-anchor="middle">${t}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function svgArt(kind) {
  const arts = {
    a: ['#e9e0cd', '#9db3a5', '#4f6a5d'],
    b: ['#f2e5d2', '#c7a884', '#8a6242'],
    c: ['#dfe6e2', '#8a9c93', '#41544b'],
    d: ['#f4e9df', '#bfa08c', '#7c5a4c']
  }[kind] || ['#e9e0cd', '#9db3a5', '#4f6a5d'];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450">
<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${arts[0]}"/><stop offset="1" stop-color="#fffaf1"/></linearGradient></defs>
<rect width="600" height="450" fill="url(#s)"/>
<circle cx="440" cy="110" r="46" fill="#f7e3c6" opacity=".85"/>
<path d="M0 330 L110 230 L200 305 L300 205 L400 300 L490 240 L600 320 L600 450 L0 450Z" fill="${arts[2]}" opacity=".55"/>
<path d="M0 380 L120 300 L230 370 L340 285 L460 365 L600 320 L600 450 L0 450Z" fill="${arts[2]}" opacity=".35"/>
<path d="M60 250 q18 -34 36 0 q-18 -12 -36 0" stroke="${arts[2]}" fill="none" opacity=".5"/>
<text x="34" y="404" font-size="26" font-family="serif" fill="#5c4a35" opacity=".55">清平山水</text>
</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ---------- 诗词库 ---------- */
const POEMS = [
  { t: '清平乐·村居', a: '辛弃疾 · 宋', c: '茅檐低小，溪上青青草。\n醉里吴音相媚好，白发谁家翁媪？\n大儿锄豆溪东，中儿正织鸡笼。\n最喜小儿亡赖，溪头卧剥莲蓬。', p: '「茅檐低小，溪上青青草」，先以景入，一低一青，村居之朴已见。以下不写自身，只写一家老小：吴音相媚，白发翁媪；大儿锄豆，中儿织笼；末以小儿子溪头卧剥莲蓬作结。三儿分叙而详略悬殊，愈闲愈见其乐。「卧」字最传神，顽皮之态尽出。全篇不用典、不着议论，纯以白描写生，稼轩之另一副笔墨。' },
  { t: '如梦令·昨夜雨疏风骤', a: '李清照 · 宋', c: '昨夜雨疏风骤，浓睡不消残酒。\n试问卷帘人，却道海棠依旧。\n知否，知否？应是绿肥红瘦。', p: '起句「昨夜雨疏风骤」并写风雨，已伏惜花之意；「浓睡不消残酒」，人与花俱在醉醒之间。以下一问一答：问者有心，答者无意，「却道海棠依旧」正见卷帘人之疏。末以「知否，知否」叠字相催，结以「绿肥红瘦」，色相俱到而情在其中。清照炼字之工，于短制中尤见。' },
  { t: '定风波·莫听穿林打叶声', a: '苏轼 · 宋', c: '莫听穿林打叶声，何妨吟啸且徐行。\n竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n料峭春风吹酒醒，微冷，山头斜照却相迎。\n回首向来萧瑟处，归去，也无风雨也无晴。', p: '小序以「同行皆狼狈，余独不觉」立骨。上片写雨中：穿林打叶，竹杖芒鞋；「一蓑烟雨任平生」由眼前之雨推及一生之境，「任」字最见胸次。下片写雨歇：料峭风吹酒醒，山头斜照却相迎，由冷转暖，一笔宕开。结以「也无风雨也无晴」，将晴雨两境一齐扫空，是禅机，亦是自解。' },
  { t: '木兰花令·拟古决绝词', a: '纳兰性德 · 清', c: '人生若只如初见，何事秋风悲画扇。\n等闲变却故人心，却道故人心易变。\n骊山语罢清宵半，泪雨霖铃终不怨。\n何如薄幸锦衣郎，比翼连枝当日愿。', p: '首句「人生若只如初见」以假设起，七字笼罩全篇。以下借班婕妤秋扇、杨妃霖铃二事，皆以初见之明反照今日之变。语似决绝，实含缠绵，怨而不怒，怨中犹存当日之愿。容若长于以一问一叹收束，此阕尤见其清怨。' },
  { t: '行路难·其一', a: '李白 · 唐', c: '金樽清酒斗十千，玉盘珍羞直万钱。\n停杯投箸不能食，拔剑四顾心茫然。\n欲渡黄河冰塞川，将登太行雪满山。\n闲来垂钓碧溪上，忽复乘舟梦日边。\n行路难！行路难！多歧路，今安在？\n长风破浪会有时，直挂云帆济沧海。', p: '起四句极写宴饮之盛，而「停杯投箸」「拔剑四顾」陡转，以乐景写哀，愈盛愈见其不能。中四句以冰塞黄河、雪满太行设喻，行路之难遂具象可触；忽又垂钓碧溪、乘舟日边，用吕尚、伊尹事，于绝境中开一线之望。结以「长风破浪会有时」，声调陡振。一篇之内，抑扬数转，太白笔力在此。' },
  { t: '饮酒·其五', a: '陶渊明 · 晋', c: '结庐在人境，而无车马喧。\n问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。\n山气日夕佳，飞鸟相与还。\n此中有真意，欲辨已忘言。', p: '「结庐在人境，而无车马喧」设一问，随以「心远地自偏」自答，一篇之旨已尽。中四句采菊、见山、山气、飞鸟，皆于不经意间得之，「悠然」二字尤妙，有意则失。结言「欲辨已忘言」，非不能辨，辨则落言筌。陶诗不假雕饰而意味自长，此篇最得其真。' },
  { t: '一剪梅·红藕香残玉簟秋', a: '李清照 · 宋', c: '红藕香残玉簟秋。轻解罗裳，独上兰舟。\n云中谁寄锦书来？雁字回时，月满西楼。\n花自飘零水自流。一种相思，两处闲愁。\n此情无计可消除，才下眉头，却上心头。', p: '起句「红藕香残玉簟秋」，一物一候，秋意已满。上片独上兰舟、雁字回时、月满西楼，皆在等待中推移；「云中谁寄锦书来」一问，点破所待者何。下片「花自飘零水自流」，以物之自在反衬人之不能自主。「才下眉头，却上心头」八字，写愁之来去无方，语淡而味永。' },
  { t: '山居秋暝', a: '王维 · 唐', c: '空山新雨后，天气晚来秋。\n明月松间照，清泉石上流。\n竹喧归浣女，莲动下渔舟。\n随意春芳歇，王孙自可留。', p: '首联点明时地，「空山新雨后」一句洗净尘氛。颔联月照松间、泉流石上，一静一动，光与声相生。颈联忽入人事：竹喧而知浣女归，莲动而见渔舟下，以声写人，人未至而境已活。尾联「王孙自可留」反用楚辞，收得从容。摩诘以画法入诗，此篇可为范式。' },
  { t: '卜算子·咏梅', a: '陆游 · 宋', c: '驿外断桥边，寂寞开无主。\n已是黄昏独自愁，更著风和雨。\n无意苦争春，一任群芳妒。\n零落成泥碾作尘，只有香如故。', p: '上片写梅之处境：驿外断桥、寂寞无主，已是黄昏，更著风雨，层层加逼而梅自若。下片写梅之品格：「无意苦争春」一句定调，「一任群芳妒」见其不屑。结以「零落成泥碾作尘，只有香如故」，形可毁而香不可夺，咏物至此已入人格。放翁借梅自道，语直而气劲。' },
  { t: '青玉案·元夕', a: '辛弃疾 · 宋', c: '东风夜放花千树，更吹落、星如雨。\n宝马雕车香满路。凤箫声动，玉壶光转，一夜鱼龙舞。\n蛾儿雪柳黄金缕，笑语盈盈暗香去。\n众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。', p: '上片极写元夕之盛：花千树、星如雨、宝马雕车、凤箫玉壶、一夜鱼龙，铺陈愈繁，正为下文留反衬。下片转写观灯之人，蛾儿雪柳，笑语暗香，皆在明处。结以「众里寻他千百度，蓦然回首，那人却在，灯火阑珊处」，一热一冷，境界陡转。稼轩于繁华处写孤高，此其所以高。' },
  { t: '摸鱼儿·更能消几番风雨', a: '辛弃疾 · 宋', c: '更能消、几番风雨，匆匆春又归去。\n惜春长怕花开早，何况落红无数。\n春且住。见说道、天涯芳草无归路。\n怨春不语。算只有殷勤，画檐蛛网，尽日惹飞絮。\n\n长门事，准拟佳期又误。蛾眉曾有人妒。\n千金纵买相如赋，脉脉此情谁诉？\n君莫舞。君不见、玉环飞燕皆尘土。\n闲愁最苦。休去倚危栏，斜阳正在，烟柳断肠处。', p: '「更能消、几番风雨，匆匆春又归去」，起句即以问破空而来，「更能消」三字中含无数回耐；春归非一时之归，乃几番风雨之后不得不归。上片由惜春而留春、而怨春，层层递进：惜春故「长怕花开早」，留春故呼「春且住」，春终不语，则唯有画檐蛛网「尽日惹飞絮」，以无情之物写有情之痴，愈见其无可奈何。下片忽入长门旧事，陈皇后失宠、蛾眉见妒，「准拟佳期又误」六字，把一腔期待写得七零八落。「千金纵买相如赋，脉脉此情谁诉」，用典而不隔，赋可买而情不可达，语极沉痛而气极含蓄。结处「休去倚危栏」是劝止之辞，实为不堪之辞；斜阳烟柳，断肠正在不言之中。怨而能厚，愤而能婉，南宋沉郁一派之典范。' },,
  { t: '登高', a: '杜甫 · 唐', c: '风急天高猿啸哀，渚清沙白鸟飞回。\n无边落木萧萧下，不尽长江滚滚来。\n万里悲秋常作客，百年多病独登台。\n艰难苦恨繁霜鬓，潦倒新停浊酒杯。', p: '首联十四字六景，风、天、猿、渚、沙、鸟，一句一物，而「哀」字先定全篇之调。颔联以落木之萧萧对长江之滚滚，一竖一横，一有限一无尽，天地之阔与身世之微并见。颈联「万里」「百年」两两相撑，把漂泊与衰病写尽，八句之中此为脊梁。结以「新停浊酒杯」，欲遣愁而并酒亦不得，沉郁至此，古今七律第一。' },
  { t: '春望', a: '杜甫 · 唐', c: '国破山河在，城春草木深。\n感时花溅泪，恨别鸟惊心。\n烽火连三月，家书抵万金。\n白头搔更短，浑欲不胜簪。', p: '起句「国破」与「山河在」对举，一破一在，愈见其荒；「城春」与「草木深」亦对举，春在而人不在。花鸟本可娱人，此则溅泪惊心，物皆著我之色彩。颈联由家国转及身家，烽火与家书轻重相形，「抵万金」三字最见乱世之情。结写搔首，白发日短，忧思有形。' },
  { t: '使至塞上', a: '王维 · 唐', c: '单车欲问边，属国过居延。\n征蓬出汉塞，归雁入胡天。\n大漠孤烟直，长河落日圆。\n萧关逢候骑，都护在燕然。', p: '首联以「单车」写形单影只，奉使而似孤旅。颔联蓬飞雁归，一出一入，身与物俱远。颈联「直」「圆」二字，以最简之形写最阔之境，一竖一横，塞外苍茫尽收笔底，画法入诗之极则。尾联借候骑一语收束，不写己之感慨，而边事自见。' },
  { t: '过故人庄', a: '孟浩然 · 唐', c: '故人具鸡黍，邀我至田家。\n绿树村边合，青山郭外斜。\n开轩面场圃，把酒话桑麻。\n待到重阳日，还来就菊花。', p: '起二句不写景而先写事，「具鸡黍」三字见田家之朴、故人之真。颔联绿树合而青山斜，一近一远，一收一放，村庄之形遂具。颈联开轩把酒，话不及功名，只说桑麻，其人其境俱淡。结以「还来就菊花」预约后期，语淡而情长，唐人田园第一。' },
  { t: '送友人', a: '李白 · 唐', c: '青山横北郭，白水绕东城。\n此地一为别，孤蓬万里征。\n浮云游子意，落日故人情。\n挥手自兹去，萧萧班马鸣。', p: '首联青山白水，一横一绕，已具送别之地。颔联「孤蓬万里」，以物喻人，一去无根。颈联最工：浮云喻游子之无定，落日喻故人之难留，两句不着一「别」字而别意充满。结以班马长鸣收，马犹恋群，人何以堪。' },
  { t: '登鹳雀楼', a: '王之涣 · 唐', c: '白日依山尽，黄河入海流。\n欲穷千里目，更上一层楼。', p: '前两句一收一放：白日依山而尽，是目之所极；黄河入海而流，是思之所至。十字之中有天地，而气象不迫。后两句由景入理，登楼本为望远，望远须更登，理在事中，不假议论。四句两两对仗而浑然无迹，五绝中之以少胜多者。' },
  { t: '黄鹤楼', a: '崔颢 · 唐', c: '昔人已乘黄鹤去，此地空余黄鹤楼。\n黄鹤一去不复返，白云千载空悠悠。\n晴川历历汉阳树，芳草萋萋鹦鹉洲。\n日暮乡关何处是？烟波江上使人愁。', p: '前四句以「黄鹤」三复，一句一转，愈转愈空，遂使千载白云皆为怅惘。第三联忽落眼前，晴川芳草，历历萋萋，由虚返实，由空入色。结以「乡关何处」一问，烟波江上，愁在言外。前半古体、后半律体，一气贯注，太白见之而搁笔，非虚语。' },
  { t: '江雪', a: '柳宗元 · 唐', c: '千山鸟飞绝，万径人踪灭。\n孤舟蓑笠翁，独钓寒江雪。', p: '前两句以「绝」「灭」二字扫尽天地，千山万径皆空；后两句以一舟一翁点出，愈空则愈孤，愈孤则愈见其守。四句二十字，由大到小，由众到独，如画之收锋。钓者非钓雪，钓其不可夺之志耳。' },
  { t: '锦瑟', a: '李商隐 · 唐', c: '锦瑟无端五十弦，一弦一柱思华年。\n庄生晓梦迷蝴蝶，望帝春心托杜鹃。\n沧海月明珠有泪，蓝田日暖玉生烟。\n此情可待成追忆，只是当时已惘然。', p: '起以「无端」二字发问，怨瑟之弦多，实怨年华之易逝。中四句连用四典，庄生之迷、望帝之托、鲛人之泪、蓝田之烟，皆可解而不可尽解，意象重叠处正是情之深处。结以「当时已惘然」，谓不必待追忆而始惘然，一语道尽。义山诗之美，正在其不可尽解。' },
  { t: '山行', a: '杜牧 · 唐', c: '远上寒山石径斜，白云生处有人家。\n停车坐爱枫林晚，霜叶红于二月花。', p: '首句「远」「斜」二字写山路之深曲，次句白云人家，于高寒处忽见烟火。第三句一「停」一「爱」，人之情动于中；结句以霜叶比二月花，不写秋之衰而写秋之艳，一反悲秋之调，遂成千古名句。' },
  { t: '水调歌头·明月几时有', a: '苏轼 · 宋', c: '明月几时有？把酒问青天。不知天上宫阙，今夕是何年。\n我欲乘风归去，又恐琼楼玉宇，高处不胜寒。\n起舞弄清影，何似在人间。\n转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？\n人有悲欢离合，月有阴晴圆缺，此事古难全。\n但愿人长久，千里共婵娟。', p: '起以问月发端，与太白之问同调而异趣：太白问天，东坡问月，皆有不可问之慨。「欲乘风归去」而又「恐」，一往一返，见其出世入世之两难；「何似在人间」一语自解，遂由天上落回人间。下片由月及人，「不应有恨」故作诘问，随即自解以「古难全」，怨而能宽。结以祝愿收，格局顿开，中秋词之绝唱。' },
  { t: '念奴娇·赤壁怀古', a: '苏轼 · 宋', c: '大江东去，浪淘尽，千古风流人物。\n故垒西边，人道是，三国周郎赤壁。\n乱石穿空，惊涛拍岸，卷起千堆雪。\n江山如画，一时多少豪杰。\n遥想公瑾当年，小乔初嫁了，雄姿英发。\n羽扇纶巾，谈笑间，樯橹灰飞烟灭。\n故国神游，多情应笑我，早生华发。\n人生如梦，一尊还酹江月。', p: '起句「大江东去」四字，挟江声而下，随即以「浪淘尽」接入人物，景与史合而为一。「乱石」三句，一穿一拍一卷，字字有势，「千堆雪」尤见其奇。下片写公瑾，以「小乔初嫁」衬其年少，以「谈笑间」写其从容，愈轻愈见其重。结以「人生如梦」自嘲，豪放之中忽带苍凉，是东坡本色。' },
  { t: '雨霖铃·寒蝉凄切', a: '柳永 · 宋', c: '寒蝉凄切，对长亭晚，骤雨初歇。\n都门帐饮无绪，留恋处，兰舟催发。\n执手相看泪眼，竟无语凝噎。\n念去去，千里烟波，暮霭沉沉楚天阔。\n多情自古伤离别，更那堪，冷落清秋节！\n今宵酒醒何处？杨柳岸，晓风残月。\n此去经年，应是良辰好景虚设。\n便纵有千种风情，更与何人说？', p: '起三句以蝉、亭、雨层层点染，未写别而别气已满。「兰舟催发」与「留恋」相逼，一留一催，两情俱见。「执手」二句，无语胜于有语。上片结以「千里烟波」，视线随舟而去，遂开下片之境。「杨柳岸，晓风残月」六字，不着一愁而愁在其中，为宋词写景之极。' },
  { t: '声声慢·寻寻觅觅', a: '李清照 · 宋', c: '寻寻觅觅，冷冷清清，凄凄惨惨戚戚。\n乍暖还寒时候，最难将息。\n三杯两盏淡酒，怎敌他、晚来风急！\n雁过也，正伤心，却是旧时相识。\n满地黄花堆积，憔悴损，如今有谁堪摘？\n守着窗儿，独自怎生得黑！\n梧桐更兼细雨，到黄昏、点点滴滴。\n这次第，怎一个愁字了得！', p: '开篇十四叠字，由寻索而冷清而凄惨，层层下沉，声情与字义俱重，为词史创格。中间以淡酒、晚风、过雁、黄花、梧桐、细雨次第铺排，皆寻常物事，而一一刺心。「独自怎生得黑」一句，以口语写长夜，最为沉痛。结以「怎一个愁字了得」，索性以一字承之，反觉无尽。' },
  { t: '醉花阴·薄雾浓云愁永昼', a: '李清照 · 宋', c: '薄雾浓云愁永昼，瑞脑消金兽。\n佳节又重阳，玉枕纱厨，半夜凉初透。\n东篱把酒黄昏后，有暗香盈袖。\n莫道不消魂，帘卷西风，人比黄花瘦。', p: '上片写昼与夜：雾浓云薄，香烟渐消，一「永」字见日之长；「半夜凉初透」，凉自外入而愁自内生。下片把酒东篱，暗香盈袖，本可自遣，而愈遣愈孤。结三句层层逼出，「帘卷西风」是景，「人比黄花瘦」是形，不言相思而相思尽在其中，易安炼意之工。' },
  { t: '破阵子·为陈同甫赋壮词以寄之', a: '辛弃疾 · 宋', c: '醉里挑灯看剑，梦回吹角连营。\n八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。\n马作的卢飞快，弓如霹雳弦惊。\n了却君王天下事，赢得生前身后名。\n可怜白发生！', p: '起以「醉里」「梦回」二字定虚实，剑与角一静一鸣，皆在梦中。中段分炙、翻声、点兵，三事并写，气象极盛；下段马快弓惊，追奔逐北，读之如闻蹄鼓。结忽以「可怜白发生」五字跌回现实，前九句之壮至此尽散，愈壮则愈悲，此词之绝处。' },
  { t: '采桑子·书博山道中壁', a: '辛弃疾 · 宋', c: '少年不识愁滋味，爱上层楼。爱上层楼，为赋新词强说愁。\n而今识尽愁滋味，欲说还休。欲说还休，却道天凉好个秋。', p: '上片以「不识」二字写少年，层楼之爱、新词之赋，皆说愁之姿态，愁则未至。下片以「识尽」二字对之，欲说而又休，两叠「欲说还休」，把一腔难言尽行咽下。结忽以「天凉好个秋」五字岔开，愈轻描愈沉痛，此老境之愁，非少年所能道。' },
  { t: '满江红·怒发冲冠', a: '岳飞 · 宋', c: '怒发冲冠，凭栏处、潇潇雨歇。\n抬望眼，仰天长啸，壮怀激烈。\n三十功名尘与土，八千里路云和月。\n莫等闲，白了少年头，空悲切。\n靖康耻，犹未雪；臣子恨，何时灭。\n驾长车，踏破贺兰山缺。\n壮志饥餐胡虏肉，笑谈渴饮匈奴血。\n待从头、收拾旧山河，朝天阙。', p: '起句「怒发冲冠」直以形写愤，凭栏、抬望、长啸，三动作相连，气自上涌。「三十功名」「八千里路」，以数字对举，半生行迹尽在其中；「尘与土」「云和月」则并功名与跋涉一并看轻。下片转入国耻，「饥餐」「渴饮」语极激烈，忠愤之至，不计工拙。结以「收拾旧山河」，全篇之气始有着落。' },
  { t: '鹊桥仙·纤云弄巧', a: '秦观 · 宋', c: '纤云弄巧，飞星传恨，银汉迢迢暗度。\n金风玉露一相逢，便胜却人间无数。\n柔情似水，佳期如梦，忍顾鹊桥归路。\n两情若是久长时，又岂在朝朝暮暮。', p: '上片以云、星、银河布景，「弄巧」「传恨」二字，物皆有情。「金风玉露」一句，以少胜多，一夕之逢压尽人间无数。下片「似水」写柔，「如梦」写暂，「忍顾」二字尤苦，归路便在眼前。结以议论作转，谓情之长久不在朝夕，语近理而情更深，遂为千古口实。' },
  { t: '浣溪沙·一曲新词酒一杯', a: '晏殊 · 宋', c: '一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？\n无可奈何花落去，似曾相识燕归来。小园香径独徘徊。', p: '起二句以「新」与「旧」对举，词新、酒新，而天气亭台仍旧，物是人非之意已寓。「夕阳西下几时回」一问，问得无从作答。下片「无可奈何」「似曾相识」一联，一去一来，一衰一荣，属对极工而感慨极深。结以独自徘徊收，不作议论，余味在花径之间。' },
  { t: '蝶恋花·槛菊愁烟兰泣露', a: '晏殊 · 宋', c: '槛菊愁烟兰泣露，罗幕轻寒，燕子双飞去。\n明月不谙离恨苦，斜光到晓穿朱户。\n昨夜西风凋碧树，独上高楼，望尽天涯路。\n欲寄彩笺兼尺素，山长水阔知何处。', p: '起句以菊、兰起兴，一「愁」一「泣」，物皆代人说恨；「燕子双飞」反衬人之独处。明月本无知，偏怨其「不谙」，是无理而有情。下片「西风凋碧树」一句扫尽余绿，「独上高楼，望尽天涯路」境界陡开，由闺阁之愁转为苍茫之望，遂成古今治学三境之第一境。结以山长水阔收，欲寄而无处可寄。' },
  { t: '蝶恋花·庭院深深深几许', a: '欧阳修 · 宋', c: '庭院深深深几许，杨柳堆烟，帘幕无重数。\n玉勒雕鞍游冶处，楼高不见章台路。\n雨横风狂三月暮，门掩黄昏，无计留春住。\n泪眼问花花不语，乱红飞过秋千去。', p: '起句三「深」字叠用，一院之深遂成一座囚笼；杨柳堆烟、帘幕无数，皆所以遮断望眼。上片写人之不归，下片写春之不留，两层俱是无可如何。「门掩黄昏」四字，掩得住黄昏，掩不住春去。结以问花不语、乱红飞过，人花同尽，凄婉之至。' },
  { t: '渔家傲·秋思', a: '范仲淹 · 宋', c: '塞下秋来风景异，衡阳雁去无留意。\n四面边声连角起，千嶂里，长烟落日孤城闭。\n浊酒一杯家万里，燕然未勒归无计。\n羌管悠悠霜满地，人不寐，将军白发征夫泪。', p: '上片以「异」字领起，雁去无留意、边声连角、孤城早闭，塞下之荒寒与戒备并见。「长烟落日孤城闭」一句，画意中自有兵气。下片以一杯浊酒对万里家山，功未成而归不得，遂成两难。结以白发与泪并举，将军征夫同此一夜，边词中之沉实者。' },
  { t: '江城子·乙卯正月二十日夜记梦', a: '苏轼 · 宋', c: '十年生死两茫茫，不思量，自难忘。\n千里孤坟，无处话凄凉。\n纵使相逢应不识，尘满面，鬓如霜。\n夜来幽梦忽还乡，小轩窗，正梳妆。\n相顾无言，惟有泪千行。\n料得年年肠断处，明月夜，短松冈。', p: '起句「十年生死」四字并置，时间与阴阳俱断；「不思量，自难忘」六字最见其深，不刻意而自不能已。「尘满面，鬓如霜」以自画像作相逢之预设，愈见十年之摧折。下片入梦，小轩窗、正梳妆，是旧日常景，愈寻常愈痛。结以「明月夜，短松冈」收，不写己之泪而写年年此地，哀感顽艳。' },
  { t: '卜算子·黄州定慧院寓居作', a: '苏轼 · 宋', c: '缺月挂疏桐，漏断人初静。\n谁见幽人独往来，缥缈孤鸿影。\n惊起却回头，有恨无人省。\n拣尽寒枝不肯栖，寂寞沙洲冷。', p: '起二句以缺月、疏桐、漏断三事布一孤境，「挂」字静中有动。幽人与孤鸿互影，人即鸿、鸿即人，物我难分。下片写鸿之惊、之回、之恨，皆无人省察；「拣尽寒枝不肯栖」一句，写尽不肯苟合之志。结以沙洲之冷收，冷在境，亦在心。' },
  { t: '临江仙·夜饮东坡醒复醉', a: '苏轼 · 宋', c: '夜饮东坡醒复醉，归来仿佛三更。\n家童鼻息已雷鸣。敲门都不应，倚杖听江声。\n长恨此身非我有，何时忘却营营。\n夜阑风静縠纹平。小舟从此逝，江海寄余生。', p: '上片全是琐事：醉归、三更、鼻息、敲门不应，愈琐愈见其闲；「倚杖听江声」一句，人声既绝，江声遂入，境忽开阔。下片由身及心，「此身非我有」是庄生之叹，「何时忘却营营」是自问。结以夜静波平、小舟远去，不作决绝语而意已决。' },
  { t: '踏莎行·雾失楼台', a: '秦观 · 宋', c: '雾失楼台，月迷津渡，桃源望断无寻处。\n可堪孤馆闭春寒，杜鹃声里斜阳暮。\n驿寄梅花，鱼传尺素，砌成此恨无重数。\n郴江幸自绕郴山，为谁流下潇湘去。', p: '起三句以「失」「迷」「无寻」层层写其不可见，桃源既断，遂无可归。上片以孤馆、春寒、鹃声、斜阳四事围之，境愈逼而情愈窄。下片以驿梅、尺素堆叠，「砌成」二字把无形之恨写成有形之墙。结问郴江为谁流去，无理而有至情，少游之伤心处。' },
  { t: '青玉案·凌波不过横塘路', a: '贺铸 · 宋', c: '凌波不过横塘路，但目送、芳尘去。\n锦瑟华年谁与度？月桥花院，琐窗朱户，只有春知处。\n飞云冉冉蘅皋暮，彩笔新题断肠句。\n试问闲愁都几许？一川烟草，满城风絮，梅子黄时雨。', p: '起句以「不过」二字写咫尺之隔，目送芳尘，人已远而心随之。「锦瑟华年谁与度」一问，转入悬想，月桥花院、琐窗朱户，皆想象中之境。下片以云暮题句，愁无从说，乃设问以三景作答：烟草、风絮、梅雨，一叠一叠地铺开，愁遂有形有量，古今喻愁之绝唱。' },
  { t: '苏幕遮·燎沉香', a: '周邦彦 · 宋', c: '燎沉香，消溽暑。鸟雀呼晴，侵晓窥檐语。\n叶上初阳干宿雨，水面清圆，一一风荷举。\n故乡遥，何日去？家住吴门，久作长安旅。\n五月渔郎相忆否？小楫轻舟，梦入芙蓉浦。', p: '上片写夏日清晨，由焚香、消暑、雀语渐入荷塘；「一一风荷举」五字，一「举」字使风荷俱活，最为词家称赏。下片忽转思乡，吴门与长安相隔，归期无日。结以渔郎相忆、梦入芙蓉浦，实境收于梦境，清圆之景遂化为乡愁之载。' },
  { t: '武陵春·风住尘香花已尽', a: '李清照 · 宋', c: '风住尘香花已尽，日晚倦梳头。\n物是人非事事休，欲语泪先流。\n闻说双溪春尚好，也拟泛轻舟。\n只恐双溪舴艋舟，载不动许多愁。', p: '起句以风住、尘香、花尽三事并写一春之终，不言人而人在其中；「倦梳头」三字，衰懒之态尽出。「物是人非事事休」一句，索性说尽，而「欲语泪先流」以动作承之，情更沉。下片假一游春之念，随即以「载不动」三字推翻，愁遂有了重量，易安晚年之笔。' },
  { t: '如梦令·常记溪亭日暮', a: '李清照 · 宋', c: '常记溪亭日暮，沉醉不知归路。\n兴尽晚回舟，误入藕花深处。\n争渡，争渡，惊起一滩鸥鹭。', p: '全篇三十三字，只写一次日暮归舟，而兴致之酣、迷途之趣俱在其中。「沉醉不知归路」是忘，误入藕花深处是错，错得恰好。「争渡，争渡」两叠，桨声人声俱急；结以鸥鹭惊飞，一滩白色骤起，画面至此活透。易安写少女之乐，不加一字议论。' },
  { t: '永遇乐·京口北固亭怀古', a: '辛弃疾 · 宋', c: '千古江山，英雄无觅，孙仲谋处。\n舞榭歌台，风流总被，雨打风吹去。\n斜阳草树，寻常巷陌，人道寄奴曾住。\n想当年，金戈铁马，气吞万里如虎。\n元嘉草草，封狼居胥，赢得仓皇北顾。\n四十三年，望中犹记，烽火扬州路。\n可堪回首，佛狸祠下，一片神鸦社鼓。\n凭谁问：廉颇老矣，尚能饭否？', p: '起以「无觅」二字定调，江山千古而英雄不存，一开篇便是苍茫。继以斜阳草树点寄奴旧迹，金戈铁马，气吞万里，追想愈雄则现实愈寂。下片以元嘉草草戒轻举，以四十三年伤久废，佛狸祠下神鸦社鼓，民已忘战，最堪痛心。结以廉颇自况，一问到底，悲愤俱在言外。' },
  { t: '西江月·夜行黄沙道中', a: '辛弃疾 · 宋', c: '明月别枝惊鹊，清风半夜鸣蝉。\n稻花香里说丰年，听取蛙声一片。\n七八个星天外，两三点雨山前。\n旧时茅店社林边，路转溪桥忽见。', p: '上片以月、鹊、风、蝉起，视听并到；「稻花香里说丰年」一句，农事之喜不着一字议论，只借蛙声说出。下片星疏雨微，是夏夜将雨之候，笔极轻而境极真。结以路转溪桥、茅店忽见，人之惊喜随脚步而生，全词遂有收束之趣。' },
  { t: '水龙吟·登建康赏心亭', a: '辛弃疾 · 宋', c: '楚天千里清秋，水随天去秋无际。\n遥岑远目，献愁供恨，玉簪螺髻。\n落日楼头，断鸿声里，江南游子。\n把吴钩看了，栏杆拍遍，无人会，登临意。\n休说鲈鱼堪脍，尽西风，季鹰归未？\n求田问舍，怕应羞见，刘郎才气。\n可惜流年，忧愁风雨，树犹如此！\n倩何人唤取，红巾翠袖，揾英雄泪！', p: '上片由楚天、江水写起，一阔一远；远山献愁供恨，山亦代人言。落日断鸿，游子独立，境已极孤；「把吴钩看了，栏杆拍遍」两句，动作写出胸中块垒，而终以「无人会」三字收煞，孤愤遂不可解。下片连用季鹰、刘备二典自明其志，复以「树犹如此」叹年华，结以红巾翠袖揾泪，英雄之泪最不堪。' },
  { t: '钗头凤·红酥手', a: '陆游 · 宋', c: '红酥手，黄縢酒，满城春色宫墙柳。\n东风恶，欢情薄。一怀愁绪，几年离索。错、错、错。\n春如旧，人空瘦，泪痕红浥鲛绡透。\n桃花落，闲池阁。山盟虽在，锦书难托。莫、莫、莫。', p: '起三句以手、酒、柳并写，色香俱在，正是当日之盛；「东风恶」三字陡转，欢情遂薄。三叠「错」字，一字一顿，如槌击心。下片「春如旧，人空瘦」，以景物之不改反衬人之摧折。结三叠「莫」字，欲言而止，较之「错」更深一层，盖错已成，莫可如何。' },
  { t: '扬州慢·淮左名都', a: '姜夔 · 宋', c: '淮左名都，竹西佳处，解鞍少驻初程。\n过春风十里，尽荠麦青青。\n自胡马窥江去后，废池乔木，犹厌言兵。\n渐黄昏，清角吹寒，都在空城。\n杜郎俊赏，算而今、重到须惊。\n纵豆蔻词工，青楼梦好，难赋深情。\n二十四桥仍在，波心荡、冷月无声。\n念桥边红药，年年知为谁生。', p: '起以名都佳处写昔日之盛，随即以「尽荠麦青青」五字翻落，盛衰只在片语。「废池乔木，犹厌言兵」最奇，草木亦厌，则人之厌兵可知。下片借杜牧旧句作今昔之比，才调犹在而深情难赋。结以二十四桥冷月无声、红药年年，物是无情之物，问得最苦，白石之清空在此。' },
  { t: '蝶恋花·伫倚危楼风细细', a: '柳永 · 宋', c: '伫倚危楼风细细，望极春愁，黯黯生天际。\n草色烟光残照里，无言谁会凭阑意。\n拟把疏狂图一醉，对酒当歌，强乐还无味。\n衣带渐宽终不悔，为伊消得人憔悴。', p: '起句危楼细风，人已久立；「黯黯生天际」把无形之愁系于天边草色，境遂旷远。上片以「无言谁会」一问，孤怀莫诉。下片欲以醉遣愁，而「强乐还无味」五字，写尽勉强之为难。结以「终不悔」三字定志，憔悴亦是甘愿，古今言情之极致。' },
  { t: '临江仙·梦后楼台高锁', a: '晏几道 · 宋', c: '梦后楼台高锁，酒醒帘幕低垂。\n去年春恨却来时。落花人独立，微雨燕双飞。\n记得小苹初见，两重心字罗衣。\n琵琶弦上说相思。当时明月在，曾照彩云归。', p: '起二句以「梦后」「酒醒」并写醒后之空，楼锁帘垂，境已成囚。「落花人独立，微雨燕双飞」十字，人与燕一单双，景极淡而情极深，千古名对。下片追忆初见，罗衣、琵琶、明月、彩云，皆旧日光影。结以明月仍在而彩云不归，物是人非之意，尽在七字之中。' },

/* ---------- 清旧号（v6）：清空历史注册数据，从根上断掉「故人」重影 ---------- */
const WIPE_V = 6;
function purgeUsers(doc) {
  const dev = doc.users.find(u => u.name === '季云知') || doc.users.find(u => u.role === 'developer');
  const keep = [], seen = new Set();
  doc.users.forEach(u => {
    const key = 'n:' + u.name;
    if (dev && u.id === dev.id) { if (!seen.has(key)) { keep.push(u); seen.add(key); } return; }
    if (!u.seedKey) return;            // 历史注册号一律清掉，新版重新注册
    if (seen.has(key)) return;
    keep.push(u); seen.add(key);
  });
  const gone = doc.users.filter(u => !keep.some(k => k.id === u.id)).map(u => u.id);
  doc.users = keep;
  if (gone.length) {
    const gs = new Set(gone);
    doc.posts = (doc.posts || []).filter(p => !gs.has(p.uid));
    doc.reqs = (doc.reqs || []).filter(r => !gs.has(r.from) && !gs.has(r.to));
    doc.dm = {};
    (doc.groups || []).forEach(g => { g.members = (g.members || []).filter(id => !gs.has(id)); });
    Object.keys(doc.groupMsgs || {}).forEach(k => {
      doc.groupMsgs[k] = (doc.groupMsgs[k] || []).filter(m => !(m.from && gs.has(m.from)));
    });
    if (doc.me && gs.has(doc.me)) doc.me = null;
  }
  doc.wipeV = WIPE_V;
  return doc;
}

function boot() {

    if (keepDev) localStorage.setItem('qlz_device', keepDev);
    localStorage.setItem('ql_wash_v6', '1');

  state = loadState();

function normalizeDoc(doc) {
  ['users', 'posts', 'signups', 'polls', 'stats', 'notices', 'groups', 'reqs', 'flyflowers'].forEach(k => { if (!Array.isArray(doc[k])) doc[k] = []; });
  ['groupMsgs', 'dm', 'visits', 'likes'].forEach(k => { if (!doc[k] || typeof doc[k] !== 'object') doc[k] = {}; });
  if (!doc.rules) doc.rules = (typeof DEFAULT_RULES !== 'undefined' ? DEFAULT_RULES : '');
  if (doc.rolesV == null) doc.rolesV = 0;

/* ---------- 增量补丁 ---------- */
function snapshot() {
  const o = {};
  SYNC_ARR.forEach(k => o[k] = state[k] || []);
  SYNC_MSG.forEach(k => o[k] = state[k] || {});
  o.visits = state.visits || {};
  o.likes = state.likes || {};
  o.rules = state.rules || '';
  o.rolesV = state.rolesV || 0;
  o.wipeV = state.wipeV || 0;
  return JSON.parse(JSON.stringify(o));
}

function diffArr(a, b) {
  const am = new Map((a || []).map(x => [x.id, x]));
  const bm = new Map((b || []).map(x => [x.id, x]));
  const u = [], d = [];
  (b || []).forEach(x => { const old = am.get(x.id); if (!old || JSON.stringify(old) !== JSON.stringify(x)) u.push(x); });
  (a || []).forEach(x => { if (!bm.has(x.id)) d.push(x.id); });
  return { u, d };
}

function diffDoc(prev, next) {
  const p = {};
  SYNC_ARR.forEach(k => {
    const r = diffArr(prev[k], next[k]);
    if (r.u.length || r.d.length) { p.c = p.c || {}; p.c[k] = r; }
  });
  SYNC_MSG.forEach(k => {
    const a = prev[k] || {}, b = next[k] || {};
    const convs = new Set(Object.keys(a).concat(Object.keys(b)));
    convs.forEach(c => {
      const r = diffArr(a[c], b[c]);
      if (r.u.length || r.d.length) {
        p.m = p.m || {};
        p.m[k] = p.m[k] || {};
        p.m[k][c] = r;
      }
    });
  });
  ['visits', 'likes'].forEach(k => {
    const a = prev[k] || {}, b = next[k] || {};
    Object.keys(b).forEach(dt => {
      Object.keys(b[dt]).forEach(uid => {
        if ((a[dt] || {})[uid] !== b[dt][uid]) {
          p.v = p.v || {};
          p.v[k] = p.v[k] || {};
          p.v[k][dt] = p.v[k][dt] || {};
          p.v[k][dt][uid] = b[dt][uid];
        }
      });
    });
  });
  const sc = {};
  if (prev.rules !== next.rules) sc.rules = next.rules;
  if (prev.rolesV !== next.rolesV) sc.rolesV = next.rolesV;
  if ((prev.wipeV || 0) !== (next.wipeV || 0)) sc.wipeV = next.wipeV || 0;
  if (Object.keys(sc).length) p.s = sc;
  return p;
}

function hasPatch(p) {
  return !!(p && ((p.c && Object.keys(p.c).length) || (p.m && Object.keys(p.m).length) ||
    (p.v && Object.keys(p.v).length) || p.s));
}

function mergeArr(cur, r) {
  let arr = (cur || []).slice();
  if (r.d && r.d.length) { const dels = new Set(r.d); arr = arr.filter(x => !dels.has(x.id)); }
  (r.u || []).forEach(item => {
    const i = arr.findIndex(x => x.id === item.id);
    if (i > -1) arr[i] = item; else arr.push(item);
  });
  return arr;
}

function applyPatchTo(doc, p) {
  if (!p) return doc;
  normalizeDoc(doc);
  Object.keys(p.c || {}).forEach(k => { doc[k] = mergeArr(doc[k], p.c[k]); });
  Object.keys(p.m || {}).forEach(k => {
    doc[k] = doc[k] || {};
    Object.keys(p.m[k]).forEach(c => { doc[k][c] = mergeArr(doc[k][c], p.m[k][c]); });
  });
  Object.keys(p.v || {}).forEach(k => {
    doc[k] = doc[k] || {};
    Object.keys(p.v[k]).forEach(dt => {
      doc[k][dt] = doc[k][dt] || {};
      Object.assign(doc[k][dt], p.v[k][dt]);
    });
  });
  if (p.s) Object.assign(doc, p.s);
  return doc;
}

/* ---------- GitHub 仓库作为数据后端 ----------
   数据存成仓库里一个 JSON 文件，用 Contents API 读写。
   每次推送：先读最新、把本地改动并上去、再写回；冲突（409）自动重读重试。 */
const GHAPI = 'https://api.github.com';
function ghH(extra) {
  return Object.assign({
    'Accept': 'application/vnd.github+json',
    'Authorization': 'token ' + CLOUD.token,
    'X-GitHub-Api-Version': '2022-11-28'
  }, extra || {});
}
function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64dec(b) {
  const bin = atob((b || '').replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function ghUrl(path) {
  return GHAPI + '/repos/' + CLOUD.owner + '/' + CLOUD.repo + '/contents/' + (path || CLOUD.path);
}
async function ghRead() {
  const r = await fetch(ghUrl() + '?ref=' + encodeURIComponent(CLOUD.branch), { headers: ghH(), cache: 'no-store' });
  if (r.status === 404) return { sha: null, doc: null };
  if (!r.ok) throw new Error('GH ' + r.status);
  const j = await r.json();
  let doc = null;
  try { doc = JSON.parse(b64dec(j.content)); } catch (e) { doc = null; }
  return { sha: j.sha, doc };
}
async function ghPut(path, contentB64, sha, msg) {
  const body = { message: msg || ('qlz ' + Date.now().toString(36)), content: contentB64, branch: CLOUD.branch };
  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(path), {
    method: 'PUT',
    headers: ghH({ 'Content-Type': 'application/json' }),
    body: JSON.stringify(body)
  });
  let j = null; try { j = await r.json(); } catch (e) { }
  return { ok: r.ok, status: r.status, sha: j && j.content && j.content.sha, json: j };
}
async function ghFlush(p) {
  for (let i = 0; i < 4; i++) {
    const cur = await ghRead();
    const doc = (cur.doc && typeof cur.doc === 'object') ? cur.doc : {};
    normalizeDoc(doc);
    applyPatchTo(doc, p);
    const w = await ghPut(CLOUD.path, b64enc(JSON.stringify(doc)), cur.sha, '同步 ' + new Date().toLocaleTimeString());
    if (w.ok) { DB.sha = w.sha; DB.last = snapshot(); DB.lastEvent = Date.now(); return; }
    if (w.status === 409 || w.status === 422) continue;
    throw new Error('GH put ' + w.status + ' ' + ((w.json && w.json.message) || ''));
  }
  throw new Error('GH 冲突重试失败');
}
async function ghUpload(dataUrl, kind, filename) {
  const blob = await (await fetch(dataUrl)).blob();
  const m = blob.type || '';
  let ext = 'bin';
  if (m.indexOf('png') > -1) ext = 'png';
  else if (m.indexOf('webp') > -1) ext = 'webp';
  else if (m.indexOf('jpeg') > -1 || m.indexOf('jpg') > -1) ext = 'jpg';
  else if (m.indexOf('mpeg') > -1 || m.indexOf('mp3') > -1) ext = 'mp3';
  else if (m.indexOf('wav') > -1) ext = 'wav';
  else if (m.indexOf('ogg') > -1) ext = 'ogg';
  else if (m.indexOf('m4a') > -1 || m.indexOf('mp4') > -1) ext = 'm4a';
  const name = 'assets/' + kind + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7) + '.' + ext;
  const b64 = String(dataUrl).split(',')[1] || '';
  const w = await ghPut(name, b64.replace(/\s/g, ''), null, '资源 ' + new Date().toLocaleTimeString());
  if (!w.ok) throw new Error('上传失败 ' + w.status);
  return 'https://cdn.jsdelivr.net/gh/' + CLOUD.owner + '/' + CLOUD.repo + '@' + CLOUD.branch + '/' + name;
}
async function ghPoll(force) {
  try { await flushPatch(); } catch (e) { }
  let cur;
  try { cur = await ghRead(); } catch (e) { return; }
  if (!cur.sha) return;
  if (cur.sha === DB.sha && !force) return;
  if (!cur.doc || !cur.doc.users) { DB.sha = cur.sha; return; }
  const auth = localAuth();
  if (auth.me && !findMine(cur.doc.users)) { DB.sha = cur.sha; return; }
  state = normalizeDoc(Object.assign(cur.doc, auth));
  DB.last = snapshot();
  if (state.wipeV !== WIPE_V) purgeUsers(state);
  const u = findMine(state.users);
  if (u) setUid(u.id); else { state.me = null; }
  DB.sha = cur.sha;
  persistLocal();
  if (hasPatch(diffDoc(DB.last || {}, snapshot()))) queueSync();
  if (state.me && me()) { softRender(); if (typeof chatCtx !== 'undefined' && chatCtx) renderChat(); }
}
async function ghInit() {
  try {
    const cur = await ghRead();
    const doc = cur.doc;
    if (doc && doc.users && doc.users.length && hadReg()) {
      const myId = getUid();
      const localMe = (state.users || []).find(x => x.id === myId);
      if (localMe && !doc.users.some(x => x.id === localMe.id || (localMe.deviceId && x.deviceId === localMe.deviceId))) {
        localMe.deviceId = getDevice();
        doc.users.push(localMe);
      }
    }
    if (doc && doc.users && doc.users.length) {
      state = normalizeDoc(Object.assign(doc, localAuth()));
      DB.last = snapshot();                     // 以云端旧数据为基线
      if (state.wipeV !== WIPE_V) purgeUsers(state);   // 再清号，才能把删除推上去
      const u = findMine(state.users);
      if (u) setUid(u.id); else { state.me = null; state.regUid = null; }
    } else {
      state = Object.assign(state, localAuth());
      DB.last = {};
    }
    DB.sha = cur.sha;
    DB.ready = true;
    persistLocal();
    if (!doc || !doc.users || !doc.users.length) queueSync();
    if (DB.poll) clearInterval(DB.poll);
    DB.poll = setInterval(() => pollOnce(false), 60000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && DB.ready) { pollOnce(true); }
    });
    setTimeout(() => pollOnce(true), 1500);
  } catch (e) {
    console.warn('[云同步] 初始化失败，切换本地模式', e);
    DB.ready = false;
    setTimeout(() => { toast('云端未连接，当前为本机模式'); }, 1800);
  }
}

let syncTimer = null;
function queueSync() {
  if (!cloudOn() || !DB.ready) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(flushPatch, 250);
}

async function flushPatch() {
  if (!DB.ready) return;
  if (DB.busy) { clearTimeout(syncTimer); syncTimer = setTimeout(flushPatch, 300); return; }
  const next = snapshot();
  const p = diffDoc(DB.last || {}, next);
  if (!hasPatch(p)) return;
  DB.busy = true;
  try {
    if (CLOUD.p === 'gh') {
      await ghFlush(p);
    } else {
      await rpcPatch(p);
      DB.last = next;
      DB.lastEvent = Date.now();
      if (DB.channel && DB.channel.send) {
        try { await DB.channel.send({ type: 'broadcast', event: 'patch', payload: p }); } catch (e) { }
      }
    }
  } catch (e) {
    console.warn('[云同步] 推送失败，稍后重试', e);
  } finally {
    DB.busy = false;
    // 推送期间如有新改动，补一次，保证不丢
    try { if (hasPatch(diffDoc(DB.last || {}, snapshot()))) queueSync(); } catch (e) { }
  }
}

function onRemotePatch(p) {
  try {
    applyPatchTo(state, p);
    if (DB.last) applyPatchTo(DB.last, p);
    DB.lastEvent = Date.now();
    persistLocal();
    if (state.me && me()) {
      softRender();
      if (typeof chatCtx !== 'undefined' && chatCtx) renderChat();
    }
  } catch (e) { console.warn('[云同步] 应用补丁失败', e); }
}

/* 正在输入时不重绘，避免打断填写 */
let renderRetry = null;
function softRender() {
  const el = document.activeElement;
  const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT');
  if (typing) {
    clearTimeout(renderRetry);
    renderRetry = setTimeout(() => { if (state.me) softRender(); }, 1200);
    return;
  }
  renderAll();
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}

async function startRealtime() {
  try {
    if (!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    if (!window.supabase) return;
    DB.sb = window.supabase.createClient(CLOUD.url, CLOUD.key);
    const ch = DB.sb.channel('qlz-room');
    ch.on('broadcast', { event: 'patch' }, msg => {
      if (msg && msg.payload) onRemotePatch(msg.payload);
    });
    ch.subscribe();
    DB.channel = ch;
  } catch (e) {
    console.warn('[云同步] 实时通道不可用，改用轮询', e);
  }
}

async function pullDoc(rev) {
  const rows = await restGet('/rest/v1/qlz_state?id=eq.main&select=doc');
  const doc = rows && rows[0] && rows[0].doc;
  if (!doc || !doc.users) return;
  const auth = localAuth();
  // 服务端还没同步到我的账号时，保留本机数据，避免误退出
  if (auth.me && !findMine(doc.users)) return;
  state = normalizeDoc(Object.assign(doc, auth));
  DB.last = snapshot();
  if (state.wipeV !== WIPE_V) purgeUsers(state);
  const u = findMine(state.users);
  if (u) setUid(u.id); else { state.me = null; }
  DB.rev = rev;
  persistLocal();
}

async function pollOnce(force) {
  if (!DB.ready) return;
  if (CLOUD.p === 'gh') { await ghPoll(force); return; }
  try {
    await flushPatch();
    const rows = await restGet('/rest/v1/qlz_state?id=eq.main&select=updated_at');
    const rev = rows && rows[0] && rows[0].updated_at;
    if (!rev) return;
    if (rev === DB.rev && !force) return;
    const quiet = Date.now() - (DB.lastEvent || 0);
    if (!force && quiet < 12000) { DB.rev = rev; return; }  // 实时通道已在工作，不必整包重拉
    await pullDoc(rev);
    if (state.me && me()) { softRender(); if (typeof chatCtx !== 'undefined' && chatCtx) renderChat(); }
  } catch (e) { /* 断网时静默 */ }
}

function localAuth() {
  return {
    me: getUid(),
    registered: hadReg() || !!getUid(),
    regUid: getUid(),
    visitOnce: (state && state.visitOnce) || {}
  };
}

async function cloudInit() {
  if (CLOUD.p === 'gh') { await ghInit(); return; }
  try {
    const rows = await restGet('/rest/v1/qlz_state?id=eq.main&select=doc,updated_at');
    const row = rows && rows[0];
    const doc = row && row.doc;
    // 旧版本把账号只存在本机：首次接入云端时把本人账号补进云端，避免「被清号」
    if (doc && doc.users && doc.users.length && hadReg()) {
      const myId = getUid();
      const localMe = (state.users || []).find(x => x.id === myId);
      if (localMe && !doc.users.some(x => x.id === localMe.id || (localMe.deviceId && x.deviceId === localMe.deviceId))) {
        localMe.deviceId = getDevice();
        doc.users.push(localMe);
      }
    }
    if (doc && doc.users && doc.users.length && doc.wipeV !== WIPE_V) { purgeUsers(doc); }
    if (doc && doc.users && doc.users.length) {
      state = normalizeDoc(Object.assign(doc, localAuth()));
      const u = findMine(state.users);
      if (u) setUid(u.id); else { state.me = null; state.regUid = null; }
      if (doc.wipeV !== state.wipeV) { state.wipeV = WIPE_V; }
    } else {
      state = Object.assign(state, localAuth());
    }
    DB.rev = row ? row.updated_at : null;
    DB.last = (doc && doc.users && doc.users.length) ? snapshot() : {};
    DB.ready = true;
    persistLocal();
    if (!doc || !doc.users || !doc.users.length) queueSync(); // 首次建库：把种子数据写上去
    startRealtime();
    if (DB.poll) clearInterval(DB.poll);
    DB.poll = setInterval(() => pollOnce(false), 60000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && DB.ready) { pollOnce(true); }
    });
    setTimeout(() => pollOnce(true), 1000);
  } catch (e) {
    console.warn('[云同步] 初始化失败，切换本地模式', e);
    DB.ready = false;
    setTimeout(() => { toast('云同步未连接，当前为本机模式'); }, 1800);
  }
}

function fieldHtml(f) {
  const id = 'f_' + f.key;
  let inner = '';
  if (f.type === 'textarea') inner = `<textarea class="ta" id="${id}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea>`;
  else if (f.type === 'datetime') inner = `<input class="inp" type="datetime-local" id="${id}" value="${esc(f.value || '')}">`;
  else if (f.type === 'checkbox') inner = `<label style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)"><input type="checkbox" id="${id}" ${f.value ? 'checked' : ''}>${esc(f.label)}</label>`;
  else if (f.type === 'select') inner = `<select class="inp" id="${id}">${(f.choices || []).map(c => `<option value="${esc(c.v)}">${esc(c.t)}</option>`).join('')}</select>`;
  else inner = `<input class="inp" type="${f.type === 'number' ? 'number' : 'text'}" id="${id}" placeholder="${esc(f.ph || '')}" value="${esc(f.value || '')}">`;
  const label = f.type === 'checkbox' ? '' : `<div class="hint" style="margin-bottom:5px">${esc(f.label)}</div>`;
  return `<div style="margin-bottom:12px">${label}${inner}</div>`;

/* ---------- 图片压缩 ---------- */
function compress(file, maxW, quality) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, maxW / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', quality || 0.82));
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function pickImage(cb, maxW = 1200) {
  const p = $('#filePicker');
  p.value = '';
  p.onchange = async () => {
    const f = p.files[0]; if (!f) return;
    try {
      toast('图片知处理中…');
      const cloud = typeof cloudOn === 'function' && cloudOn();
      // 未接云端时本机容量有限，九图自动降到 1280 以保证存得下
      const d = await compress(f, cloud ? maxW : Math.min(maxW, 1280), cloud ? 0.86 : 0.8);
      let out = d;
      if (typeof cloudOn === 'function' && cloudOn()) {
        try { out = await cloudUpload(d, 'img', 'p.jpg'); } catch (e) { out = d; }
      }
      cb(out);
    }
    catch (e) { toast('图片知读取失败'); }
  };
  p.click();
}
function pickAudio(cb) {
  const p = $('#filePickerAudio');
  p.value = '';
  p.onchange = () => {
    const f = p.files[0]; if (!f) return;
    if (f.size > 25 * 1024 * 1024) { toast('音频请小于 25MB（多了真的跑不动了的，本知看了看，以飞雪玉花为例，近四分半，是22.59MB，其余的天地缓缓之类，四分半只要7.61MB，我尽量优化，若连上云端后，会好些，我会放宽这一频率的。）'); return; }
    if (f.size > 3 * 1024 * 1024 && !(typeof cloudOn === 'function' && cloudOn())) { toast('这段音频较大，本机存不住，先到「个人设置 → 云端」配好云同步再传'); return; }
    const fr = new FileReader();
    fr.onload = async () => {
      let out = fr.result;
      if (typeof cloudOn === 'function' && cloudOn()) {
        try { out = await cloudUpload(out, 'audio', f.name || 'a.mp3'); }
        catch (e) { if (f.size > 3 * 1024 * 1024) { toast('这段音频传云端失败，本机也存不住，请检查网络后再试'); return; } out = fr.result; }
      }
      cb(out, f.name);
    };
    fr.readAsDataURL(f);
  };
  p.click();
}

async function register(name, avatar) {
  name = String(name || '').trim();
  // 云端已有同名账号：直接认领，绝不重复建号
  if (CLOUD.p === 'gh' && cloudOn()) {
    try {
      toast('正在核对云端账号…');
      const cur = await ghRead();
      if (cur.doc && Array.isArray(cur.doc.users)) {
        const remote = cur.doc.users;
        // 合并到本地：云端有的补齐，避免后面比对出错
        remote.forEach(ru => {
          if (!state.users.some(x => x.id === ru.id)) state.users.push(ru);
        });
        const exist = remote.find(u => u.name === name);
        if (exist) {
          const devs = new Set(exist.deviceIds || []);
          if (exist.deviceId) devs.add(exist.deviceId);
          devs.add(getDevice());
          exist.deviceIds = Array.from(devs);
          state.me = exist.id; state.registered = true; state.regUid = exist.id;
          setUid(exist.id);
          persistLocal(); queueSync();
          toast('已认出你的账号：' + exist.name);
          setTimeout(() => enterApp(), 600);
          return;
        }
      }
    } catch (e) { /* 网络不好就按老流程走 */ }
  }
  // 同设备已有账号：直接认领，绝不再建第二个号（「故人」重影的根子就在这）
  const devId = typeof getDevice === 'function' ? getDevice() : null;
  const sameDev = devId ? state.users.find(u => u.deviceId === devId || (u.deviceIds || []).indexOf(devId) > -1) : null;
  if (sameDev) {
    state.me = sameDev.id; state.registered = true; state.regUid = sameDev.id;
    if (typeof setUid === 'function') setUid(sameDev.id);
    saveState();
    closeModal(); enterApp();
    toast('本设备已有账号「' + sameDev.name + '」，已为你登入');
    return;
  }
  if (state.users.some(u => u.name === name)) { toast('该昵称已被占用，请换一个'); return; }
  const id = 'u_me_' + Date.now().toString(36);
  const u = {
    id, name, sig: '春风不止，清平不散。', avatar: avatar || svgAvatar(name),
    bg: null, music: null, splash: null, chatBg: null, chatMusic: null,
    role: 'member', friends: [], createdAt: Date.now(), visitsTotal: 0,
    wxId: 'wx_' + id, wxName: name
  };
  // 只有「季云知」是开发者，其他人一律为成员
  if (name.trim() === '季云知') u.role = 'developer';
  if (typeof getDevice === 'function') u.deviceId = getDevice();
  state.users.push(u);
  state.me = id; state.registered = true; state.regUid = id;
  if (typeof setUid === 'function') setUid(id);

  // 默认进入大群聊（已有则加入，没有则创建）
  const mainG = state.groups.find(g => g.isMain);
  if (mainG) {
    if (!mainG.members.includes(id)) mainG.members.push(id);
    state.groupMsgs[mainG.id] = state.groupMsgs[mainG.id] || [];
    state.groupMsgs[mainG.id].push({ id: uid('m'), type: 'sys', text: `「${name}」加入了清平乐醉清欢`, time: Date.now() });
  } else {
    const all = state.users.map(x => x.id);
    state.groups.unshift({
      id: 'g_main', name: '清平乐·醉清欢', isMain: true, members: all,
      ownerId: id, createdAt: Date.now()
    });
    state.groupMsgs['g_main'] = [
      { id: uid('m'), type: 'sys', text: `「${name}」加入了清平乐醉清欢`, time: Date.now() - 60000 },
      { id: uid('m'), from: 'u_jyz', text: '今夕可否为春？', time: Date.now() - 50000 },
      { id: uid('m'), from: 'u_hf', text: '今雨可为故雨？', time: Date.now() - 40000 }
    ];
  }

  // 好友申请演示
  state.reqs.unshift(
    { id: uid('r'), from: 'u_hf', to: id, time: Date.now() - 1800000, status: 'pending' },
    { id: uid('r'), from: 'u_dm', to: id, time: Date.now() - 900000, status: 'pending' }
  );

  // 昨日榜单补一笔自己的数据
  const y = ymd(dayShift(-1));
  state.visits[y] = state.visits[y] || {};
  state.visits[y][id] = 12;

  saveState();
  closeModal();
  enterApp();
  toast('注册成功，已加入清平乐大群聊');
}

/* ---------- 定时结算 ---------- */
function settleItems() {
  const now = Date.now();
  let changed = false;
  ['signups', 'polls', 'stats'].forEach(k => {
    state[k].forEach(it => {
      if (!it.closed && it.expiresAt <= now) {
        it.closed = true; it.settledAt = now; changed = true;
      }
    });
  });
  state.notices.forEach(n => {
    if (!n.published && n.publishAt && n.publishAt <= now) { n.published = true; changed = true; }
  });
  if (changed) { saveState(); renderAll(); toast('有帮会事项已满二十四小时，自动结算完成'); }
}
function settleTick() { settleItems(); setInterval(settleItems, 20000); }

    title: '发起接龙', desc: '实名参加，一人一接，二十四小时后自动结算。',

      { key: 'title', label: '接龙标题', ph: '例：本周帮战接龙 · 清平乐出战名单' },
      { key: 'note', label: '说明（可选）', type: 'textarea', ph: '集合时间、分工要求等' }

        id: uid('s'), title: v.title, note: v.note, creatorId: state.me, creatorName: me().name,

function joinSignup(id) {
  const it = state.signups.find(s => s.id === id); if (!it) return;
  if (it.closed) return toast('此接龙已结算');
  const m = me();
  if (it.entries.some(e => e.uid === m.id)) return toast('每人仅可接一次');
  it.entries.push({ uid: m.id, name: m.name, time: Date.now(), note: '' });
  saveState(); renderTools(); toast('接龙成功，你是第 ' + it.entries.length + ' 位');
}

    <div class="card-title" style="margin-bottom:6px"><span class="bar"></span>帮会投票<span class="tag">一人一票 · 二十四小时结算</span></div>

    ${can ? `<button class="btn btn-primary mt8" onclick="createPoll()">发起投票</button>` : ''}
  </div>`;
  if (!list.length) html += `<div class="empty">暂无投票。</div>`;
  list.forEach(it => {
    const total = it.options.reduce((s, o) => s + o.votes.length, 0);
    const myVote = it.options.findIndex(o => o.votes.includes(m.id));
    const sorted = it.closed ? it.options.slice().sort((a, b) => b.votes.length - a.votes.length) : [];
    const winner = sorted[0] || null;
    const tied = sorted.length > 1 && sorted[1].votes.length === winner.votes.length && winner.votes.length > 0;
    html += `<div class="item">
      <div class="item-head">
        ${it.pinned ? `<span class="badge badge-pin">置顶</span>` : ''}
        <b>${esc(it.title)}</b>
        <span class="badge ${it.closed ? 'badge-ok' : 'badge-wait'}">${it.closed ? '已结算' : leftText(it.expiresAt)}</span>
      </div>
      <div class="meta">由 ${esc(it.creatorName || '清平乐')} 发布 · ${it.anonymous ? '匿名投票' : '实名投票'} · 共 ${total} 票</div>
      <div class="options">${it.options.map((o, i) => {
      const pct = total ? Math.round(o.votes.length / total * 100) : 0;
      return `<div class="opt ${myVote === i ? 'voted' : ''}" ${it.closed || myVote > -1 ? '' : `onclick="votePoll('${it.id}',${i})"`}>
          <span class="radio"></span>
          <span class="opt-name">${esc(o.text)}</span>
          <span class="opt-cnt">${it.closed ? pct + '% · ' + o.votes.length + ' 票' : o.votes.length + ' 票'}</span>
        </div>`;
    }).join('')}</div>
      ${it.closed ? `<div class="summary">结算：${winner ? (tied ? `${esc(winner.text)} 等并列第一（各 ${winner.votes.length} 票）` : `${esc(winner.text)} 胜出（${winner.votes.length} 票）`) : '无有效票'}</div>`
      : myVote > -1 ? `<div class="meta mt8">你已投给「${esc(it.options[myVote].text)}」，一人一票，不可更改。</div>`
        : `<div class="meta mt8">点击选项投票，一人一票。</div>`}
      ${can ? `<div class="row mt8">
        <button class="btn btn-mini btn-ghost" onclick="closeItem('polls','${it.id}')">提前结算</button>
        <button class="btn btn-mini btn-ghost" onclick="pinItem('polls','${it.id}')">${it.pinned ? '取消置顶' : '置顶'}</button>
        <button class="btn btn-mini btn-danger" onclick="delItem('polls','${it.id}')">删除</button></div>` : ''}
    </div>`;
  });
  return html;
}
function createPoll() {
  if (!isAdmin(me())) return toast('仅管理员可发起投票');
  askForm({
    title: '发起投票', desc: '每行一个选项，至少两项；一人一票，二十四小时后自动结算。',
    fields: [
      { key: 'title', label: '投票主题', ph: '例：下月帮会活动去哪儿？' },
      { key: 'opts', label: '选项（每行一个）', type: 'textarea', rows: 4, ph: '夜游江南水乡\n山中露营赏星\n线上诗词雅集' },
      { key: 'anonymous', label: '匿名投票（不显示谁投了哪项）', type: 'checkbox', value: true }
    ],
    ok: '发布并置顶',
    onSubmit: v => {
      const opts = v.opts.split('\n').map(s => s.trim()).filter(Boolean);
      if (!v.title) { toast('请填写主题'); return false; }
      if (opts.length < 2) { toast('至少需要两个选项'); return false; }
      state.polls.unshift({
        id: uid('v'), title: v.title, creatorId: state.me, creatorName: me().name, pinned: true,
        anonymous: !!v.anonymous, createdAt: Date.now(), expiresAt: Date.now() + 86400000, closed: false,
        options: opts.map(t => ({ text: t, votes: [] }))
      });
      saveState(); renderTools(); toast('投票已发布并置顶');
    }

}
function votePoll(id, idx) {
  const it = state.polls.find(p => p.id === id); if (!it || it.closed) return;
  const m = me();
  if (it.options.some(o => o.votes.includes(m.id))) return toast('一人一票，你已投过');
  it.options[idx].votes.push(m.id);
  saveState(); renderTools(); toast('投票成功');
}

function createStat() {
  if (!isAdmin(me())) return toast('仅管理员可发起统计表');
  askForm({
    title: '发起统计表', desc: '每行一个字段名，最多四项；每人每日限填一次。',
    fields: [
      { key: 'title', label: '统计表名称', ph: '例：本周帮贡统计表' },

      { key: 'fields', label: '字段（每行一个）', type: 'textarea', rows: 3, ph: '本周帮贡\n在线时长（小时）' },
      { key: 'anonymous', label: '允许匿名提交', type: 'checkbox', value: true }
    ],
    ok: '发布并置顶',
    onSubmit: v => {
      const fs = v.fields.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 4);
      if (!v.title) { toast('请填写名称'); return false; }
      if (!fs.length) { toast('请至少填写一个字段'); return false; }
      state.stats.unshift({
        id: uid('t'), title: v.title, desc: v.desc, creatorId: state.me, creatorName: me().name,
        pinned: true, anonymous: !!v.anonymous, createdAt: Date.now(), expiresAt: Date.now() + 86400000,
        closed: false, fields: fs.map(s => ({ key: 'f' + Math.random().toString(36).slice(2, 6), label: s })), entries: []
      });
      saveState(); renderTools(); toast('统计表已发布并置顶');
    }
  });
}
function submitStat(id) {
  const it = state.stats.find(s => s.id === id); if (!it) return;
  const m = me();
  if (it.closed) return toast('此统计表已结算');
  if (it.entries.some(e => e.uid === m.id && ymd(e.time) === ymd())) return toast('每人每日仅可提交一次');
  const values = {};
  for (const f of it.fields) {
    const v = ($('#st_' + id + '_' + f.key) || {}).value;
    values[f.key] = (v || '').trim();
  }
  if (Object.values(values).every(v => !v)) return toast('请至少填写一项');
  it.entries.push({
    uid: m.id, anonymous: !!(it.anonymous && ($('#anon_' + id) || {}).checked),
    values, time: Date.now()
  });
  saveState(); renderTools(); toast('已提交今日统计');
}

function closeItem(kind, id) {
  if (!isAdmin(me())) return toast('仅管理员可操作');

function pinItem(kind, id) {

function delItem(kind, id) {

/* ---------- 每日清平 ---------- */
function renderDaily() {
  const m = me(), can = isAdmin(m);
  const y = ymd(dayShift(-1));
  const feed = state.notices.slice()
    .filter(n => n.published || (can && n.publishAt))
    .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.time - a.time);

  let html = `<div class="card" style="padding:12px 14px">
    <div class="card-title" style="margin-bottom:6px"><span class="bar"></span>今日公告<span class="tag">每日清平</span></div>
    <p class="hint">${can ? '你为管理员，可在此发布今日公告与图片，亦可定时发布；系统每日自动总结昨日重大事件。'
      : '公告由六名管理员（含群主、开发者）发布，可指定发布时间。成员可阅，不可发。'}</p>
    ${can ? `<button class="btn btn-primary mt8" onclick="createNotice()">发布今日公告</button>` : ''}
  </div>`;

  feed.forEach(n => {
    const scheduled = !n.published;
    html += `<div class="notice ${n.pinned ? 'pinned' : ''}">
      <div class="n-head">
        <img src="${avatarOf(userById(n.authorId))}" style="width:28px;height:28px;border-radius:50%">
        <div><div class="n-title">${esc(n.authorName || '清平乐')}</div>
        <div class="meta">${scheduled ? `<span class="badge badge-wait">定时发布 · ${fmtFull(n.publishAt)}</span>` : fmtFull(n.time)}</div></div>
        ${n.pinned ? `<span class="badge badge-pin" style="margin-left:auto">置顶</span>` : ''}
      </div>
      <div class="n-body">${esc(n.content)}${(n.imgs || []).map(s => `<img src="${s}">`).join('')}</div>
      ${can ? `<div class="row mt8"><button class="btn btn-mini btn-ghost" onclick="toggleNoticePin('${n.id}')">${n.pinned ? '取消置顶' : '置顶'}</button>
        <button class="btn btn-mini btn-danger" onclick="delNotice('${n.id}')">删除</button></div>` : ''}
    </div>`;
  });

  html += renderBoards(y);
  $('#page-daily').innerHTML = html;
}

function renderBoards(y) {
  const v = state.visits[y] || {}, l = state.likes[y] || {};
  const vt = Object.keys(v).filter(id => userById(id)).map(id => ({ u: userById(id), n: v[id] })).sort((a, b) => b.n - a.n);
  const lt = Object.keys(l).filter(id => userById(id)).map(id => ({ u: userById(id), n: l[id] })).sort((a, b) => b.n - a.n);
  const wv = vt[0], wl = lt[0];

  const rows = (arr, unit) => arr.slice(0, 3).map((x, i) => `<div class="board-row r${i + 1}">
      <div class="board-rank">${i + 1}</div>
      <img src="${avatarOf(x.u)}"><div class="board-name">${esc(x.u.name)}</div>
      <div class="board-val">${x.n} ${unit}</div></div>`).join('') || '<div class="meta">昨日暂无记录</div>';

  let sum = '';
  if (wv) sum += `· ${esc(wv.u.name)} 荣获昨日人气榜（按昨日个人主页访问量 ${wv.n} 次发布）<br>`;
  if (wl) sum += `· ${esc(wl.u.name)} 荣获昨日风华榜（按昨日朋友圈点赞量 ${wl.n} 次发布）<br>`;
  const yPosts = state.posts.filter(p => ymd(new Date(p.time)) === y).length;
  sum += `· 昨日新增动态 ${yPosts} 条`;
  const settled = state.signups.filter(s => s.closed && s.settledAt && ymd(new Date(s.settledAt)) === y);
  settled.forEach(s => { sum += `<br>· 昨日接龙「${esc(s.title)}」结算，共 ${s.entries.length} 人`; });

  return `<div class="card">
    <div class="card-title"><span class="bar"></span>昨日风云榜<span class="tag">${y} · 自动统计</span></div>
    <div class="section-label">人气榜 · 按个人主页访问量</div>
    <div class="boards">${rows(vt, '次')}</div>
    <div class="section-label" style="margin-top:12px">风华榜 · 按朋友圈点赞量</div>
    <div class="boards">${rows(lt, '赞')}</div>
    <div class="summary"><b style="color:var(--jade)">昨日重大事件（自动总结）</b><br>${sum}</div>
  </div>`;
}

function createNotice() {

/* ---------- 花繁若轩 ---------- */
let draftImgs = [];
function renderMoments() {
  const m = me(), can = isAdmin(m);
  let html = `<div class="card">
    <div class="card-title"><span class="bar"></span>花繁若轩<span class="tag">朋友圈 · 可附图</span></div>
    <textarea class="ta" id="postTa" rows="3" placeholder="今日山水、心事与清欢……"></textarea>
    <div class="img-pick" id="postImgs">${draftImgs.map((s, i) =>
      `<div class="thumb"><img src="${s}"><span onclick="delDraftImg(${i})">×</span></div>`).join('')}</div>
    <div class="row mt8">
      <button class="btn btn-ghost" style="width:auto;padding:8px 14px;font-size:12.5px" onclick="addDraftImg()">＋ 图片</button>
      <span class="hint">最多 9 张</span>
      <button class="btn btn-primary" style="width:110px;margin-left:auto;padding:9px" onclick="publishPost()">发布</button>
    </div>
  </div>`;

  const list = state.posts.slice().sort((a, b) => b.time - a.time);
  if (!list.length) html += `<div class="empty">轩中尚无百花影，何妨信手醉春风。</div>`;
  list.forEach(p => {
    const u = userById(p.uid) || { name: '故人', id: p.uid };
    const liked = p.likes.includes(m.id);
    const mine = p.uid === m.id;
    html += `<div class="moment">
      <div class="moment-top" onclick="openProfile('${p.uid}')">
        <img src="${avatarOf(u)}">
        <div><div class="m-name">${esc(u.name)}${isAdmin(u) ? ' <span class="badge badge-role">' + ROLE[u.role] + '</span>' : ''}</div>
        <div class="m-time">${fmtTime(p.time)}</div></div>
        ${mine ? `<button class="m-del" onclick="event.stopPropagation();delPost('${p.id}')">⋯</button>` : ''}
      </div>
      ${p.content ? `<div class="m-text">${esc(p.content)}</div>` : ''}
      ${p.imgs && p.imgs.length ? `<div class="m-imgs ${p.imgs.length === 1 ? 'one' : p.imgs.length === 2 ? 'two' : ''}">
        ${p.imgs.map(s => `<img src="${s}" onclick="viewImage('${p.id}')">`).join('')}</div>` : ''}
      <div class="m-actions">
        <button class="m-act ${liked ? 'liked' : ''}" onclick="likePost('${p.id}')">♡ ${p.likes.length}</button>
        <button class="m-act" onclick="openProfile('${p.uid}')">◎ 主页 · ${((userById(p.uid) || {}).visitsTotal) || 0}</button>
        ${(mine || can) ? `<button class="m-act" style="margin-left:auto;color:var(--sub)" onclick="delPost('${p.id}')">${can && !mine ? '管理员删除' : '删除'}</button>` : ''}
      </div>
    </div>`;
  });
  $('#page-moments').innerHTML = html;
}
function addDraftImg() {
  if (draftImgs.length >= 9) return toast('最多 9 张');
  pickImage(d => { draftImgs.push(d); renderMoments(); }, 1600);
}
function delDraftImg(i) { draftImgs.splice(i, 1); renderMoments(); }
function publishPost() {
  const m = me();
  const text = ($('#postTa').value || '').trim();
  if (!text && !draftImgs.length) return toast('写点什么，或选一张图');
  state.posts.unshift({ id: uid('p'), uid: m.id, content: text, imgs: draftImgs.slice(), time: Date.now(), likes: [] });
  draftImgs = [];
  saveState(); renderMoments(); toast('已发布到花繁若轩');
}
function likePost(id) {
  const p = state.posts.find(x => x.id === id); if (!p) return;
  const m = me();
  const i = p.likes.indexOf(m.id);
  if (i > -1) { p.likes.splice(i, 1); }
  else {
    p.likes.push(m.id);
    const d = ymd(); state.likes[d] = state.likes[d] || {};
    state.likes[d][p.uid] = (state.likes[d][p.uid] || 0) + 1;
  }
  saveState(); renderMoments();
}
function delPost(id) {
  const p = state.posts.find(x => x.id === id); if (!p) return;

/* ---------- 蝶梦袅袅：每日诗词 ---------- */
const POEM_ON = { '2026-11-27': '摸鱼儿·更能消几番风雨' };
function poemIndex(offset = 0) {
  const d = dayShift(offset);
  const key = ymd(d);
  if (offset === 0 && POEM_ON[key]) {
    const i = POEMS.findIndex(x => x.t === POEM_ON[key]);
    if (i > -1) return i;
  }
  const dayNum = Math.floor(d.getTime() / 86400000);
  return ((dayNum % POEMS.length) + POEMS.length) % POEMS.length;
}
function renderPoem() {
  const idx = poemIndex(0);
  const p = POEMS[idx];
  const issue = Math.floor(new Date().setHours(0, 0, 0, 0) / 86400000) % 1000;
  let html = `<div class="poem-wrap">
    <div class="poem-tag">每日诗词推送 · 第 ${issue} 期</div>
    <div class="poem-title">${esc(p.t)}</div>
    <div class="poem-author">${esc(p.a)}</div>
    <div class="poem-body">${esc(p.c)}</div>
    <div class="poem-appr"><b>赏析</b><br>${esc(p.p)}</div>
    <div class="meta" style="text-align:right;margin-top:12px">每日 05:30 自动推送 · 今日已送达</div>
  </div>
  ${renderFly()}
  <div class="card">
    <div class="card-title"><span class="bar"></span>近七日诗单<span class="tag">蝶梦袅袅</span></div>
    ${[0, 1, 2, 3, 4, 5, 6].map(o => {
    const q = POEMS[poemIndex(-o)];
    const d = dayShift(-o);
    return `<div class="poem-his"><div class="d">${o === 0 ? '今日' : `${d.getMonth() + 1}/${d.getDate()}`}</div>
        <div class="t">${esc(q.t)}</div><div class="d" style="width:auto">${esc(q.a.split('·')[0].trim())}</div></div>`;
  }).join('')}
  </div>
  <div class="card" style="padding:12px 14px">
    <p class="hint">为保证清平乐可正常醉梦，此页只推送诗词与赏析，不设图片上传入口。图文只归于「花繁若轩」。</p>
  </div>`;
  $('#page-poem').innerHTML = html;
}

function addFriends(a, b) {

  if (!ua.friends.includes(b)) ua.friends.push(b);
  if (!ub.friends.includes(a)) ub.friends.push(a);
}

function openUserSheet(id) {
  const u = userById(id); if (!u) return;
  const friend = isFriend(state.me, id);
  const req = state.reqs.find(r => r.from === state.me && r.to === id && r.status === 'pending');
  openSheet(`<div class="sheet-head"><img src="${avatarOf(u)}">
      <div><b>${esc(u.name)}</b><small>${ROLE[u.role]} · ${esc(u.sig || '')}</small></div></div>

      : req ? `<div class="sheet-item" style="color:var(--sub)">好友申请已发出，待对方同意</div>`
        : `<div class="sheet-item" onclick="closeSheet();applyFriend('${id}')">申请加为好友</div>`}
