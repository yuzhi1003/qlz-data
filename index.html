function applyFriend(id) {
  const u = userById(id); if (!u) return;
  if (isFriend(state.me, id)) return toast('你们已是好友');
  if (state.reqs.some(r => r.from === state.me && r.to === id && r.status === 'pending')) return toast('申请已发出，请等待');
  const r = { id: uid('r'), from: state.me, to: id, time: Date.now(), status: 'pending' };
  state.reqs.unshift(r);
  saveState(); renderFriends();
  toast('已向「' + u.name + '」发出好友申请');
}
function decideReq(rid, yes) {
  const r = state.reqs.find(x => x.id === rid); if (!r) return;
  if (r.status !== 'pending') return;
  if (yes) {
    r.status = 'accepted'; addFriends(r.from, r.to);
    toast('已与「' + (userById(r.from) || {}).name + '」成为好友');
  } else { r.status = 'rejected'; toast('已拒绝该申请'); }
  saveState(); renderAll();
}
function processNpcReqs() {
  let changed = false;
  const npcIds = state.users.filter(u => u.seedKey && u.id !== state.me).map(u => u.id);
  state.reqs.forEach(r => {
    if (r.status === 'pending' && npcIds.includes(r.to) && Date.now() - r.time > 6000) {
      r.status = 'accepted'; addFriends(r.from, r.to); changed = true;
    }
  });
  if (changed) { saveState(); renderAll(); toast('对方已同意你的好友申请'); }
}

    <div class="admin-grid">${slots.map((u, i) => u
    ? `<div class="adm"><img src="${avatarOf(u)}"><div><div class="a-name">${esc(u.name)}</div><div class="a-role">${ROLE[u.role]}</div></div></div>`
    : `<div class="adm" style="opacity:.55;border-style:dashed"><div class="avatar" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.04);border-radius:8px;font-size:12px;color:var(--sub)">空</div><div><div class="a-name">第 ${i + 1} 席</div><div class="a-role">未设</div></div></div>`).join('')}</div>
    <div class="section-label" style="margin-top:14px">权限</div>
    <p class="hint" style="line-height:2">· 可删其余成员动态与图片<br>· 可发布接龙、投票、统计表，并自动置顶<br>· 可于每日清平发布今日公告、图片，支持定时发布<br>· 系统每日自动总结昨日重大事件</p>
    <div class="section-label" style="margin-top:14px">人事</div>
    ${isDev ? `<button class="btn btn-primary mb8" onclick="appoint('owner')">任命群主（开发者权限）</button>` : ''}
    ${(isDev || isOwner) ? `<button class="btn btn-primary mb8" onclick="appoint('admin')">任命管理员</button>` : ''}
    ${admins.filter(u => u.role === 'admin' || (isDev && u.role === 'owner')).length && (isDev || isOwner)
      ? `<div class="pill-row">${admins.filter(u => (u.role === 'admin' && (isDev || isOwner)) || (u.role === 'owner' && isDev))
        .map(u => `<button class="pill" onclick="dismissAdmin('${u.id}')">${esc(u.name)} · 卸任</button>`).join('')}</div>` : ''}
    ${!isDev && !isOwner ? `<p class="hint">群主与管理员由开发者、群主任命。</p>` : ''}
    <div class="section-label" style="margin-top:14px">内容治理</div>
    <div class="pill-row">${state.posts.slice(0, 8).map(p => {
    const u = userById(p.uid) || {};
    return `<button class="pill" onclick="delPost('${p.id}')">删：${esc(u.name || '')} · ${esc((p.content || '图片').slice(0, 8))}</button>`;
  }).join('') || '<span class="hint">暂无动态</span>'}</div>
    <div class="row mt12"><button class="btn btn-ghost" onclick="closeModal()">收起</button></div>`);
}
function appoint(role) {
  const m = me();
  if (role === 'owner' && m.role !== 'developer') return toast('仅开发者可任命群主');
  if (role === 'admin' && !(m.role === 'developer' || m.role === 'owner')) return toast('仅开发者或群主可任命管理员');
  const choices = state.users.filter(u => u.id !== state.me && u.role !== 'developer' && u.role !== 'owner')
    .map(u => ({ v: u.id, t: u.name + (u.role === 'admin' ? '（管理员）' : '') }));
  if (!choices.length) return toast('暂无可任命成员');
  askForm({
    title: role === 'owner' ? '任命群主' : '任命管理员',
    desc: '总管理员不得超过六名（含开发者）。',
    fields: [{ key: 'id', label: '选择成员', type: 'select', choices }],
    onSubmit: v => {
      const u = userById(v.id); if (!u) return false;
      if (role === 'owner') {
        if (u.role !== 'admin' && adminCount() >= ADMIN_CAP) { toast('管理员已满六名，需先卸任一位'); return false; }
        const old = state.users.find(x => x.role === 'owner');
        if (old) old.role = 'member';
        u.role = 'owner';
        saveState(); renderAll(); setTimeout(() => { closeModal(); openAdmin(); }, 0);
        toast('已任命「' + u.name + '」为群主，其可自行任命管理员');
        return;
      }
      if (u.role !== 'admin' && adminCount() >= ADMIN_CAP) { toast('管理员已满六名'); return false; }
      u.role = 'admin';
      saveState(); renderAll(); setTimeout(() => { closeModal(); openAdmin(); }, 0);
      toast('已任命「' + u.name + '」为管理员');
    }
  });
}
function dismissAdmin(id) {
  const u = userById(id); if (!u) return;
  if (u.role === 'developer') return toast('开发者不可卸任');
  const m = me();
  if (u.role === 'owner' && m.role !== 'developer') return toast('仅开发者可卸任群主');
  if (u.role === 'admin' && !(m.role === 'developer' || m.role === 'owner')) return toast('无权限');
  confirmBox('卸任确认', '确定让「' + u.name + '」卸任？', () => {
    u.role = 'member'; saveState(); renderAll(); closeModal(); openAdmin(); toast('已卸任');
  }, '卸任');
}

/* ---------- 聊天 ---------- */
let chatCtx = null;
let chatAudio = null;

function dmKey(a, b) { return [a, b].sort().join('|'); }
function openDM(id) {
  toast('无服务器，本知正在闭关中，暂时屏蔽私聊功能。');
  return;
  const u = userById(id); if (!u) return;
  chatCtx = { type: 'dm', id };
  $('#chatName').textContent = u.name;
  $('#chatSub').textContent = (u.role !== 'member' ? ROLE[u.role] + ' · ' : '') + (u.sig || '');
  $('#chatView').classList.add('show');
  applyChatStyle(); renderChat();
}
function openGroup(gid) {
  const g = state.groups.find(x => x.id === gid); if (!g) return;
  chatCtx = { type: 'group', id: gid };
  $('#chatName').textContent = g.name;
  $('#chatSub').textContent = g.members.length + ' 人 · 群聊';
  $('#chatView').classList.add('show');
  applyChatStyle(); renderChat();
}
function closeChat() {
  $('#chatView').classList.remove('show');
  chatCtx = null;
  stopChatMusic();
}
function applyChatStyle() {
  const u = me();
  const body = $('#chatBody');
  body.style.background = 'linear-gradient(180deg,#f6efe2,#efe5d3)';
  body.style.backgroundImage = u.chatBg ? `url("${u.chatBg}")` : 'none';
  stopChatMusic();
  if (u.chatMusic) {
    chatAudio = new Audio(u.chatMusic);
    chatAudio.loop = true;
    chatAudio.play().catch(() => { });
  }
}
function stopChatMusic() { if (chatAudio) { chatAudio.pause(); chatAudio = null; } }

function chatMessages() {
  if (!chatCtx) return [];
  if (chatCtx.type === 'dm') {
    const k = dmKey(state.me, chatCtx.id);
    if (!state.dm[k]) state.dm[k] = [];
    if (!state.dm[k].length) {
      state.dm[k].push({ id: uid('m'), type: 'sys', text: '你们已是好友，说句话吧', time: Date.now() });
      saveState();
    }
    return state.dm[k];
  }
  if (!state.groupMsgs[chatCtx.id]) state.groupMsgs[chatCtx.id] = [];
  if (!state.groupMsgs[chatCtx.id].length) {
    state.groupMsgs[chatCtx.id].push({ id: uid('m'), type: 'sys', text: '群聊已建立，先说句话吧', time: Date.now() });
    saveState();
  }
  return state.groupMsgs[chatCtx.id];
}
function renderChat() {
  if (!chatCtx) return;
  const list = chatMessages();
  const box = $('#chatBody');
  const isGroup = chatCtx.type === 'group';
  let html = '';
  if (!list.length) html = `<div class="empty" style="color:rgba(0,0,0,.35)">尚无言语，先递一句。</div>`;
  list.forEach(msg => {
    if (msg.type === 'sys') { html += `<div class="msg sys"><div class="bubble">${esc(msg.text)}</div></div>`; return; }
    const mine = msg.from === state.me;
    const u = userById(msg.from) || (msg.nm ? { name: msg.nm } : { name: '故人' });
    const who = (!mine && isGroup) ? `<div class="who">${esc(u.name)}</div>` : '';
    const body = msg.kind === 'img'
      ? `<img src="${msg.text}" style="max-width:180px;border-radius:10px;display:block">`
      : esc(msg.text);
    html += `<div class="msg ${mine ? 'me' : ''}">
      <img src="${avatarOf(u)}">
      <div>${who}<div class="bubble">${body}</div><div class="btime">${fmtTime(msg.time)}</div></div></div>`;
  });
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}
function sendChatMsg(kind, text) {
  if (!chatCtx) return;
  const list = chatMessages();
  const msg = { id: uid('m'), from: state.me, nm: (me() || {}).name || '', text, kind: kind || 'text', time: Date.now() };
  list.push(msg);
  saveState(); renderChat();
  const inp = $('#chatInput'); if (inp) inp.value = '';
}
function chatMore() {
  if (!chatCtx) return;
  if (chatCtx.type === 'dm') {
    const id = chatCtx.id, u = userById(id) || {};
    openSheet(`<div class="sheet-head"><img src="${avatarOf(u)}"><div><b>${esc(u.name)}</b><small>${esc(u.sig || '')}</small></div></div>
      <div class="sheet-item" onclick="closeSheet();openProfile('${id}')">查看个人主页</div>
      ${isFriend(state.me, id) ? '' : `<div class="sheet-item" onclick="closeSheet();applyFriend('${id}')">申请加为好友</div>`}
      <div class="sheet-cancel" onclick="closeSheet()">取消</div>`);
    return;
  }
  const g = state.groups.find(x => x.id === chatCtx.id); if (!g) return;
  openSheet(`<div class="sheet-head"><div class="avatar" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#35695b,#8aa79b);color:#fdf6e6">群</div>
      <div><b>${esc(g.name)}</b><small>${g.members.length} 人</small></div></div>
    <div class="sheet-item" onclick="closeSheet();renameGroup('${g.id}')">修改群名称</div>
    <div class="sheet-item" onclick="closeSheet();inviteGroup('${g.id}')">拉好友入群</div>
    <div class="sheet-item" onclick="closeSheet();viewMembers('${g.id}')">查看成员名单</div>
    ${g.isMain ? '' : `<div class="sheet-item danger" onclick="closeSheet();leaveGroup('${g.id}')">退出群聊</div>`}
    <div class="sheet-cancel" onclick="closeSheet()">取消</div>`);
}
function renameGroup(gid) {
  const g = state.groups.find(x => x.id === gid); if (!g) return;
  askForm({
    title: '修改群名称', fields: [{ key: 'name', label: '群名称', value: g.name }],
    onSubmit: v => {
      if (!v.name) { toast('群名不可为空'); return false; }
      g.name = v.name; saveState(); renderFriends();
      if (chatCtx && chatCtx.type === 'group' && chatCtx.id === gid) $('#chatName').textContent = v.name;
      toast('群名称已改为「' + v.name + '」');
    }
  });
}
function inviteGroup(gid) {
  const g = state.groups.find(x => x.id === gid); if (!g) return;
  const cand = me().friends.map(id => userById(id)).filter(u => u && !g.members.includes(u.id));
  if (!cand.length) return toast('暂无可拉入的好友（先加好友，或对方已在群中）');
  openModal(`<h3>拉好友入群</h3><p style="text-align:center;margin-bottom:12px">选择要拉入「${esc(g.name)}」的好友</p>
    ${cand.map(u => `<label style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(120,100,70,.1)">
      <input type="checkbox" value="${u.id}" class="inviteChk"><img src="${avatarOf(u)}" style="width:32px;height:32px;border-radius:8px">
      <span style="font-size:13px">${esc(u.name)}</span></label>`).join('')}
    <div class="row mt12"><button class="btn btn-ghost" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" id="invOk">拉入群聊</button></div>`);
  $('#invOk').onclick = () => {
    const ids = $$('.inviteChk').filter(c => c.checked).map(c => c.value);
    if (!ids.length) return toast('请先选择好友');
    ids.forEach(id => {
      if (!g.members.includes(id)) g.members.push(id);
      state.groupMsgs[gid] = state.groupMsgs[gid] || [];
      state.groupMsgs[gid].push({ id: uid('m'), type: 'sys', text: (userById(id) || {}).name + ' 被拉入了群聊', time: Date.now() });
    });
    saveState(); closeModal(); renderFriends();
    if (chatCtx && chatCtx.type === 'group' && chatCtx.id === gid) { $('#chatSub').textContent = g.members.length + ' 人 · 群聊'; renderChat(); }
    toast('已拉入 ' + ids.length + ' 位好友');
  };
}
function viewMembers(gid) {
  const g = state.groups.find(x => x.id === gid); if (!g) return;
  openModal(`<h3>${esc(g.name)} · 成员</h3>
    ${g.members.map(id => {
    const u = userById(id) || {}; return `<div class="friend-row"><img src="${avatarOf(u)}">
        <div class="f-main"><div class="f-name">${esc(u.name || '')}${isAdmin(u) ? ' <span class="badge badge-role">' + ROLE[u.role] + '</span>' : ''}</div>
        <div class="f-sub">${esc(u.sig || '')}</div></div></div>`;
  }).join('')}
    <button class="btn btn-ghost mt8" onclick="closeModal()">收起</button>`);
}
function createGroup() {
  askForm({
    title: '新建群聊', desc: '建群后可在群里继续拉好友入群。',
    fields: [{ key: 'name', label: '群名称', ph: '例：清平乐·夜话小群' }],
    ok: '创建',
    onSubmit: v => {
      if (!v.name) { toast('请填群名'); return false; }
      const g = { id: uid('g'), name: v.name, isMain: false, members: [state.me], ownerId: state.me, createdAt: Date.now() };
      state.groups.push(g); state.groupMsgs[g.id] = [];
      saveState(); renderFriends(); toast('群聊已创建，去拉好友进来吧');
    }
  });
}
function leaveGroup(gid) {
  const g = state.groups.find(x => x.id === gid); if (!g || g.isMain) return;
  confirmBox('退出群聊', '确定退出「' + g.name + '」？', () => {
    g.members = g.members.filter(id => id !== state.me);
    saveState(); closeChat(); renderAll(); toast('已退出群聊');
  }, '退出');
}
function openMsgList() {
  const groups = state.groups;
  const friends = me().friends.map(id => userById(id)).filter(Boolean);
  const last = (k) => {
    const arr = state.dm[k] || []; return arr.length ? arr[arr.length - 1] : null;
  };
  openSheet(`<div class="sheet-head" style="justify-content:center"><b>消息</b></div>
    ${groups.map(g => `<div class="sheet-item" style="text-align:left;display:flex;align-items:center;gap:10px" onclick="closeSheet();openGroup('${g.id}')">
      <span style="font-size:16px">群</span><div style="flex:1"><b style="font-size:13.5px">${esc(g.name)}</b>
      <div class="meta">${g.members.length} 人</div></div><span class="chev">›</span></div>`).join('')}
    ${friends.map(u => {
    const m = last(dmKey(state.me, u.id));
    return `<div class="sheet-item" style="text-align:left;display:flex;align-items:center;gap:10px" onclick="closeSheet();openDM('${u.id}')">
      <img src="${avatarOf(u)}" style="width:30px;height:30px;border-radius:8px">
      <div style="flex:1"><b style="font-size:13.5px">${esc(u.name)}</b>
      <div class="meta">${m ? esc((m.kind === 'img' ? '[图片]' : m.text).slice(0, 14)) : '尚无消息'}</div></div>
      <span class="chev">›</span></div>`;
  }).join('')}
    <div class="sheet-cancel" onclick="closeSheet()">收起</div>`);
}

/* ---------- 事件绑定 ---------- */
let wired = false, tickStarted = false;
function wire() {
  if (wired) return; wired = true;
  $('#btnWechat').onclick = wechatFlow;
  $('#btnDrawer').onclick = openDrawer;
  $('#btnMsg').onclick = openMsgList;
  $('#drawerMask').onclick = closeDrawer;
  $('#modalMask').onclick = e => { if (e.target.id === 'modalMask') closeModal(); };
  $('#sheetMask').onclick = e => { if (e.target.id === 'sheetMask') closeSheet(); };
  $$('.tab-item').forEach(n => n.onclick = () => switchTab(n.dataset.tab));
  $('#chatBack').onclick = closeChat;
  $('#chatMore').onclick = chatMore;
  $('#chatSend').onclick = () => {
    const v = $('#chatInput').value.trim(); if (!v) return;
    sendChatMsg('text', v);
  };
  $('#chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('#chatSend').click(); }
  });
  $('#chatImg').onclick = () => {
    if (!chatCtx) return;
    pickImage(d => sendChatMsg('img', d), 1400);
  };
  document.addEventListener('click', e => {
    if (e.target.id === 'rulesSave') saveRules();
  });
  // 好友页左滑 / 右滑 打开个人设置
  const friendsPage = $('#page-friends');
  let sx = 0, sy = 0, tracking = false;
  friendsPage.addEventListener('touchstart', e => {
    if (!e.touches.length) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, { passive: true });
  friendsPage.addEventListener('touchend', e => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) openDrawer();
  }, { passive: true });
}

function init() {
  boot();
  if (typeof cloudInit === 'function') cloudReady = cloudInit().then(() => { normalizeRoles(); softRenderSafe(); });
  function softRenderSafe() { try { if (state.me && me()) renderAll(); } catch (e) { } }
  wire();
  showSplash();
  if (state.me && me()) {
    // 已登录：等待启动画面结束后进入
  }
  if (!tickStarted) {
    tickStarted = true;
    setInterval(() => { if (state.me) { settleItems(); processNpcReqs(); } }, 5000);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.me) { settleItems(); }
  });
  window.closeModal = closeModal; window.closeSheet = closeSheet;
  window.closeDrawer = closeDrawer; window.openDrawer = openDrawer;
  window.openAdmin = openAdmin; window.openProfile = openProfile;
  window.openDM = openDM; window.openGroup = openGroup; window.delPost = delPost;
  window.likePost = likePost; window.applyFriend = applyFriend; window.decideReq = decideReq;
  window.openUserSheet = openUserSheet; window.delDraftImg = delDraftImg;
  window.publishPost = publishPost; window.addDraftImg = addDraftImg;
  window.viewImage = viewImage; window.setSub = setSub;
  window.createSignup = createSignup; window.joinSignup = joinSignup;
  window.createPoll = createPoll; window.votePoll = votePoll;
  window.createStat = createStat; window.submitStat = submitStat;
  window.closeItem = closeItem; window.pinItem = pinItem; window.delItem = delItem;
  window.createNotice = createNotice; window.toggleNoticePin = toggleNoticePin;
  window.delNotice = delNotice; window.appoint = appoint; window.dismissAdmin = dismissAdmin;
  window.renameGroup = renameGroup; window.inviteGroup = inviteGroup;
  window.viewMembers = viewMembers; window.createGroup = createGroup;
  window.leaveGroup = leaveGroup; window.openMsgList = openMsgList;
  window.setAvatar = setAvatar; window.editName = editName; window.editSig = editSig;
  window.setBg = setBg; window.setSplash = setSplash; window.setChatBg = setChatBg;
  window.setChatMusic = setChatMusic; window.logout = logout;
  window.switchTab = switchTab;
  window.addFly = addFly; window.delFly = delFly;
  window.setMusic = setMusic; window.removeMusic = removeMusic;
  window.cloudConfig = cloudConfig; window.saveCloud = saveCloud; window.clearCloud = clearCloud;
}
init();
</script>
</body>
</html>
