name: 打包 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 安装构建工具
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: 编译
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/34.0.0
          JAR=$ANDROID_HOME/platforms/android-34/android.jar
          $BT/aapt2 compile --dir res -o res.zip
          $BT/aapt2 link -o unsigned.apk -I $JAR --manifest AndroidManifest.xml -A assets res.zip
          mkdir -p classes dex
          javac -source 8 -target 8 -bootclasspath $JAR -classpath $JAR -d classes src/com/qlz/qingpingyue/MainActivity.java
          $BT/d8 --lib $JAR --min-api 21 --output dex classes/com/qlz/qingpingyue/*.class
          (cd dex && zip -q -u ../unsigned.apk classes.dex)
          $BT/zipalign -f 4 unsigned.apk aligned.apk
          base64 -d keystore.b64 > ks.jks
          $BT/apksigner sign --ks ks.jks --ks-pass pass:qlz2026 --key-pass pass:qlz2026 --out 清平乐-醉清欢.apk aligned.apk
          $BT/apksigner verify 清平乐-醉清欢.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/清平乐-醉清欢.apk
